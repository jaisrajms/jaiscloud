# CI TLS front door: terminate TLS for the real cloud hostnames and proxy to the
# GCP substrate's REST port. REST only — gRPC-over-TLS needs the Istio front door
# (deploy/k8s/istio), or point clients at the plaintext h2c port 8081.
#
# Two rules that matter:
#   * Host is preserved ($host), never rewritten: the emulator routes on the
#     request authority (GKE vs Managed Kafka share /v1/.../clusters, Cloud Run
#     and Cloud Functions hosts carry identity).
#   * Any depth of name under the four suffixes is accepted (regex server_name);
#     the certificate from ci-tls/gen.sh covers the depths X.509 allows.
events {}

http {
    # "gcp" is the compose service (see docker-compose.ci.yml). For a local
    # non-compose run, change this to 127.0.0.1:8080.
    upstream gcp_rest {
        server gcp:8080;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        server_name ~^.+\.googleapis\.com$
                    ~^.+\.run\.app$
                    ~^.+\.cloudfunctions\.net$;

        location / {
            proxy_pass         http://gcp_rest;
            proxy_http_version 1.1;
            # Authority preservation (see the header comment).
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Large uploads, resumable sessions and LRO polling.
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_buffering         off;
            proxy_read_timeout      3600s;
            proxy_send_timeout      3600s;
        }
    }
}
