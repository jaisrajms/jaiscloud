---
# PersistentVolumeClaim — S3 blob bytes survive pod restarts. Owned by the AWS
# substrate namespace, so deleting the GCP substrate never touches it (and vice
# versa). The PVC root IS the S3 base dir (`/data/blobs`), which keeps the
# on-disk layout an existing install already has.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaiscloud-blobs-pvc
  namespace: jaiscloud
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
# PersistentVolumeClaim — the emulator's state dir (`/data/state`: instance-ID
# file, platform TLS cert/key). Deliberately NOT the blob PVC: the blob store
# snapshots its base dir recursively, so a state file under `/data/blobs` would
# be captured as an S3 object (a TLS private key as a bucket entry). A tiny
# claim of its own keeps state out of the object namespace without changing the
# blob layout.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaiscloud-state-pvc
  namespace: jaiscloud
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 64Mi
---
# Secret — the AWS substrate's DSN. Secrets cannot be referenced across
# namespaces (`env.valueFrom.secretKeyRef`), so every substrate namespace owns
# one; the postgres server itself runs in `jaiscloud-data`.
#
# The database is `jaiscloud`; aws/gcp isolation is by schema (`search_path`),
# and the GCP substrate uses its own database (`jaiscloud_gcp`).
apiVersion: v1
kind: Secret
metadata:
  name: jaiscloud-dsn
  namespace: jaiscloud
type: Opaque
stringData:
  dsn: "postgres://jaiscloud:jaiscloud@postgres.jaiscloud-data.svc.cluster.local:5432/jaiscloud"
---
# ConfigMap — non-secret runtime settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaiscloud-config
  namespace: jaiscloud
data:
  JAISCLOUD_PORT: "4566"
  JAISCLOUD_MODE: "full"
  JAISCLOUD_REGION: "us-east-1"
  JAISCLOUD_ACCOUNT_ID: "000000000000"
  JAISCLOUD_LOG_LEVEL: "info"
  JAISCLOUD_METRICS: "true"
  # Blob layout is unchanged: the blobs PVC's root *is* the S3 base dir, so it
  # stays mounted at /data/blobs. Changing that would orphan every object an
  # existing install already wrote.
  JAISCLOUD_BLOB_DIR: "/data/blobs"
  # Pinned identity and its state directory: ${JAISCLOUD_STATE_DIR} is a small
  # PVC of its own (see the mount below), outside the blob base dir, so the
  # instance-ID file and the platform TLS cert survive pod rolls without being
  # captured by blob-store snapshots.
  JAISCLOUD_INSTANCE_ID: "aws-substrate-1"
  JAISCLOUD_STATE_DIR: "/data/state"
  JAISCLOUD_EXECUTOR_MODE: "k8s"
  # Both EMR paths read JAISCLOUD_K8S_SPARK_IMAGE (not the legacy
  # JAISCLOUD_SPARK_IMAGE name): without it the binary refuses to start when the
  # executor mode is k8s.
  JAISCLOUD_K8S_SPARK_IMAGE: "apache/spark:3.5.0"
  JAISCLOUD_LAMBDA_IMAGE: "public.ecr.aws/lambda/python:3.12"
  JAISCLOUD_K8S_NAMESPACE: "jaiscloud"
  JAISCLOUD_K8S_APISERVER: "https://kubernetes.default.svc"
  JAISCLOUD_K8S_SA: "jaiscloud"
  JAISCLOUD_K8S_CA_FILE: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
  JAISCLOUD_K8S_TOKEN_FILE: "/var/run/secrets/kubernetes.io/serviceaccount/token"
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaiscloud
  namespace: jaiscloud
spec:
  replicas: 1
  # Single writer to Postgres and to the ReadWriteOnce blob PVC: replace the old
  # pod before starting the new one (the GCP substrate does the same), so a
  # rollout never runs two emulators with the same instance ID and DSN.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaiscloud
  template:
    metadata:
      labels:
        app: jaiscloud
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4566"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: jaiscloud
      terminationGracePeriodSeconds: 45
      containers:
        - name: jaiscloud
          image: jaisraj/jaiscloud-aws:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4566
          envFrom:
            - configMapRef:
                name: jaiscloud-config
          env:
            - name: JAISCLOUD_DSN
              valueFrom:
                secretKeyRef:
                  name: jaiscloud-dsn
                  key: dsn
          volumeMounts:
            # The blob PVC root is the S3 base dir (unchanged layout); state
            # lives on its own small claim so snapshotting the blob store cannot
            # capture the instance-ID file or the platform TLS key.
            - name: blobs
              mountPath: /data/blobs
            - name: state
              mountPath: /data/state
          readinessProbe:
            httpGet:
              path: /_jaiscloud/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_jaiscloud/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: blobs
          persistentVolumeClaim:
            claimName: jaiscloud-blobs-pvc
        - name: state
          persistentVolumeClaim:
            claimName: jaiscloud-state-pvc
---
# Service — LoadBalancer so `localhost:4566` works on Docker Desktop.
# Docker Desktop's built-in cloud-provider controller binds the external port
# directly to localhost, so no kubectl port-forward is needed.
# On other local clusters (minikube, kind) run:
#   kubectl port-forward -n jaiscloud svc/jaiscloud 4566:4566
apiVersion: v1
kind: Service
metadata:
  name: jaiscloud
  namespace: jaiscloud
spec:
  type: LoadBalancer
  selector:
    app: jaiscloud
  ports:
    - port: 4566
      targetPort: 4566
