---
# GCP substrate namespace. One namespace per concern, so deleting a substrate
# namespace never destroys the shared store:
#
#   jaiscloud       AWS substrate  (Deployment jaiscloud, blobs PVC, Service :4566); see namespace-aws.yaml
#   jaiscloud-gcp   GCP substrate  (Deployment jaiscloud-gcp, its own blobs PVC)
#   jaiscloud-data  PostgreSQL     (postgres-pvc + Services :5432 / :30543); see namespace-data.yaml
#
# Applying this file creates only the GCP substrate namespace. An AWS-only install
# applies namespace-aws.yaml instead (plus namespace-data.yaml for the store).
#
# Labels are load-bearing: `kubectl get ns -l jaiscloud.io/role` is the
# documented way to inspect the topology, and tooling selects on them.
apiVersion: v1
kind: Namespace
metadata:
  name: jaiscloud-gcp
  labels:
    app.kubernetes.io/part-of: jaiscloud
    jaiscloud.io/role: substrate
    jaiscloud.io/substrate: gcp
