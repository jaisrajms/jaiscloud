---
# PersistentVolumeClaim — object bytes survive pod restarts. Metadata lives in
# Postgres, so an ephemeral blob dir lets a rolled pod leave behind objects
# whose metadata outlives their bytes (a media read then 404s). The k3d test's
# preflight rolls this Deployment every run, so persistence is required.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaiscloud-gcp-blobs-pvc
  namespace: jaiscloud
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
# Deployment — the GCP emulator (REST :8080, gRPC :8081) with the Dataproc
# Spark-on-Kubernetes executor wired to the in-cluster GCS endpoint.
#
# The image is the same multi-cloud binary as the AWS deployment, built with
# CLOUD=gcp:  make docker-gcp  (or  REGISTRY=10.0.100.21:5050 make docker-gcp).
# Spark drivers/executors are launched as pods in this namespace using
# JAISCLOUD_K8S_SPARK_IMAGE, so the pod's ServiceAccount needs the
# jaiscloud-executor Role from rbac.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaiscloud-gcp
  namespace: jaiscloud
  labels:
    app: jaiscloud-gcp
spec:
  replicas: 1
  # Single writer to Postgres: replace the old pod before starting the new one
  # so two instances never race on the shared store during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaiscloud-gcp
  template:
    metadata:
      labels:
        app: jaiscloud-gcp
    spec:
      serviceAccountName: jaiscloud
      terminationGracePeriodSeconds: 30
      containers:
        - name: jaiscloud-gcp
          image: 10.0.100.21:5050/jaiscloud-gcp:compat
          imagePullPolicy: Always
          args:
            - start
            - --port
            - "8080"
            - --grpc-port
            - "8081"
            - --dsn
            - postgres://jaiscloud:jaiscloud@postgres.jaiscloud.svc.cluster.local:5432/jaiscloud
            - --blob-dir
            - /data/blobs
          ports:
            - name: rest
              containerPort: 8080
            - name: grpc
              containerPort: 8081
            # Hive Metastore (Thrift) serving plane. `hms` is the legacy shared
            # catalog on the base port; `hms-catalog-0`..`hms-catalog-9` are the
            # per-Service catalogs (each Metastore Service owns one, on its own
            # port starting at --hms-port + 1). Spark drivers running as
            # client-mode pods reach them via the Service's matching ports
            # below; the per-service endpoint hostname is not resolvable from
            # pods, so JAISCLOUD_DATAPROC_HMS_ENDPOINT supplies a reachable host
            # and the Service's own port is kept.
            - name: hms
              containerPort: 9083
            - name: hms-catalog-0
              containerPort: 9084
            - name: hms-catalog-1
              containerPort: 9085
            - name: hms-catalog-2
              containerPort: 9086
            - name: hms-catalog-3
              containerPort: 9087
            - name: hms-catalog-4
              containerPort: 9088
            - name: hms-catalog-5
              containerPort: 9089
            - name: hms-catalog-6
              containerPort: 9090
            - name: hms-catalog-7
              containerPort: 9091
            - name: hms-catalog-8
              containerPort: 9092
            - name: hms-catalog-9
              containerPort: 9093
          volumeMounts:
            - name: blobs
              mountPath: /data/blobs
          env:
            # Dataproc submits Spark jobs as client-mode pods in this namespace.
            - name: JAISCLOUD_SPARK_EXECUTOR_MODE
              value: k8s
            - name: JAISCLOUD_K8S_SPARK_IMAGE
              value: 10.0.100.21:5050/spark-gcs:3.5.0
            - name: JAISCLOUD_K8S_SPARK_SUBMIT_PATH
              value: /opt/spark/bin/spark-submit
            # Spark reads/writes GCS through the emulator's own in-cluster Service.
            - name: JAISCLOUD_GCS_EMULATOR_ENDPOINT
              value: http://jaiscloud-gcp.jaiscloud.svc.cluster.local:8080
            # The per-service Metastore endpoint is synthesized (not resolvable
            # from pods), so a Dataproc job attached to a Metastore service is
            # injected this pod-reachable thrift address as
            # spark.hadoop.hive.metastore.uris. Iceberg's HiveCatalog is also
            # pointed here by the job's properties.
            - name: JAISCLOUD_DATAPROC_HMS_ENDPOINT
              value: jaiscloud-gcp.jaiscloud.svc.cluster.local:9083
            - name: JAISCLOUD_PLATFORM_TLS_ENABLED
              value: "false"
            # Managed Kafka broker topology: k8s starts a single-node Redpanda
            # (rpk) Pod + Service per cluster (namespace jaiscloud) and renders
            # its in-cluster endpoint as bootstrapAddress. The jaiscloud
            # ServiceAccount already has pod/service create+delete from
            # rbac.yaml, and the emulator's in-cluster config supplies the
            # client. Set to mock to disable (no broker; synthesized cloud.goog
            # address).
            - name: JAISCLOUD_KAFKA_BROKER_MODE
              value: k8s
            # Cloud Run k8s execution: each revision's template image runs as a
            # Pod + ClusterIP Service (namespace jaiscloud) and data-plane
            # requests addressed to the synthesized *.run.app authority are
            # reverse-proxied to it. The jaiscloud ServiceAccount already has
            # pod/service create+delete from rbac.yaml. The URI suffix/port are
            # left at the real-GCP default; the optional floci interop smoke
            # run overrides them per-target (see the Makefile).
            - name: JAISCLOUD_CLOUDRUN_EXECUTOR_MODE
              value: k8s
          readinessProbe:
            httpGet:
              path: /_jaiscloud/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: blobs
          persistentVolumeClaim:
            claimName: jaiscloud-gcp-blobs-pvc
---
# Service — REST + gRPC entry point. Spark drivers/executors and the Lakehouse
# pipeline Job address the emulator through this DNS name:
#   http://jaiscloud-gcp.jaiscloud.svc.cluster.local:8080
# From the host:
#   kubectl port-forward -n jaiscloud svc/jaiscloud-gcp 8080:8080
apiVersion: v1
kind: Service
metadata:
  name: jaiscloud-gcp
  namespace: jaiscloud
  labels:
    app: jaiscloud-gcp
spec:
  type: ClusterIP
  selector:
    app: jaiscloud-gcp
  ports:
    - name: rest
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8081
    - name: hms
      port: 9083
      targetPort: 9083
    # Per-Service Hive Metastore catalogs: a Metastore Service is assigned the
    # next port above 9083, so the Service must expose the block. Widen it (and
    # the container ports above) for more than ten Services.
    - name: hms-catalog-0
      port: 9084
      targetPort: 9084
    - name: hms-catalog-1
      port: 9085
      targetPort: 9085
    - name: hms-catalog-2
      port: 9086
      targetPort: 9086
    - name: hms-catalog-3
      port: 9087
      targetPort: 9087
    - name: hms-catalog-4
      port: 9088
      targetPort: 9088
    - name: hms-catalog-5
      port: 9089
      targetPort: 9089
    - name: hms-catalog-6
      port: 9090
      targetPort: 9090
    - name: hms-catalog-7
      port: 9091
      targetPort: 9091
    - name: hms-catalog-8
      port: 9092
      targetPort: 9092
    - name: hms-catalog-9
      port: 9093
      targetPort: 9093
