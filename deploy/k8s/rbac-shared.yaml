---
# ClusterRoles shared by both substrates. This file declares no ServiceAccount
# and no binding: each substrate's identity and bindings live in its own
# rbac-<cloud>.yaml, so a single-substrate install creates no objects for the
# other cloud.
#
# Apply this file (after the substrate's namespace) and then rbac-aws.yaml or
# rbac-gcp.yaml; the deployments reference those ServiceAccounts.
---
# ClusterRole form of the executor rules. Engines that create one namespace per
# pod-owning resource (Dataproc per-cluster namespaces) bind this ClusterRole to
# the ServiceAccount with a RoleBinding in each new namespace, so the executor's
# permissions are not limited to the substrate namespace. rbac-aws.yaml and
# rbac-gcp.yaml bind it once for the substrate's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jaiscloud-executor
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
---
# Namespace lifecycle for per-resource isolation: cluster-scoped namespace
# create/delete plus the per-namespace RoleBinding that lets the executor run in
# a freshly provisioned namespace. If the deployment cannot grant this (a
# namespaced-only ServiceAccount), the engine falls back to JAISCLOUD_K8S_NAMESPACE.
#
# The binding is per substrate (jaiscloud-namespace-admin-aws in rbac-aws.yaml,
# jaiscloud-namespace-admin-gcp in rbac-gcp.yaml), not a combined one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jaiscloud-namespace-admin
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    # update/patch carry the identity-label backfill onto a namespace an older
    # emulator created before jaiscloud.io/substrate + jaiscloud.io/instance-id
    # existed. The ValidatingAdmissionPolicy jaiscloud-namespace-isolation
    # (deploy/k8s/rbac-admission-policy.yaml) keeps this scoped: a substrate may
    # only update a namespace that already carries its own labels, so it cannot
    # relabel the other substrate's namespace as its own.
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "create", "update", "delete"]
  # Needed to create a RoleBinding that references the executor ClusterRole
  # (RBAC escalation prevention otherwise rejects the per-namespace RoleBinding).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["jaiscloud-executor"]
