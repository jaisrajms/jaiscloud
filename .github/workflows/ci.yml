name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ─── Unit + integration tests ──────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download modules
        run: go mod download

      - name: Build server
        run: go build -o jaiscloud ./cmd/jaiscloud-aws/

      - name: Start jaiscloud server (background)
        run: |
          ./jaiscloud start > server.log 2>&1 & echo $! > server.pid

      - name: Wait for server health
        run: |
          for i in {1..60}; do
            if curl -sfS http://localhost:4566/_jaiscloud/health >/dev/null 2>&1; then
              echo "server healthy"; exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Export AWS env for tests
        run: |
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_REGION=us-east-1" >> $GITHUB_ENV

      - name: Run unit tests
        run: go test -race ./internal/... -v -count=1

      - name: Run integration tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: go test ./tests/integration/ -v -count=1 -timeout 300s

      - name: Upload server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi

  # ─── Docker build smoke-test ───────────────────────────────────────────────
  # Builds the image for linux/amd64 on every PR to catch Dockerfile errors early.
  # Images are not pushed — push happens only on merge to main or on a version tag
  # (see docker-publish.yml).
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build jaiscloud (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64
          build-args: VERSION=ci-${{ github.sha }}
          tags: jaiscloud:ci
          cache-from: type=gha,scope=jaiscloud
          cache-to: type=gha,mode=max,scope=jaiscloud
