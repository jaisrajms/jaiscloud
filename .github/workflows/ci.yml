name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ─── AWS unit + integration tests ──────────────────────────────────────────
  test-aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download modules
        run: go mod download

      - name: Build server
        run: go build -o jaiscloud ./cmd/jaiscloud-aws/

      - name: Start jaiscloud server (background)
        run: |
          ./jaiscloud start > server.log 2>&1 & echo $! > server.pid

      - name: Wait for server health
        run: |
          for i in {1..60}; do
            if curl -sfS http://localhost:4566/_jaiscloud/health >/dev/null 2>&1; then
              echo "server healthy"; exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Export AWS env for tests
        run: |
          echo "AWS_ACCESS_KEY_ID=test" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=test" >> $GITHUB_ENV
          echo "AWS_REGION=us-east-1" >> $GITHUB_ENV

      - name: Run unit tests (AWS + shared packages)
        run: go test -race -count=1 $(go list ./internal/... | grep -v '/internal/gcp/')

      - name: Run integration tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
        run: go test ./tests/integration/ -v -count=1 -timeout 300s

      - name: Upload server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi

  # ─── Docker build smoke-test ───────────────────────────────────────────────
  # Builds both cloud images for linux/amd64 on every PR to catch Dockerfile
  # errors early, then runs each image: the version stamp (VERSION build arg),
  # /_jaiscloud/health on the cloud's REST port, and the embedded console on
  # 4567 (proves `-tags ui` + the UI build stage). Images are not pushed — push
  # happens only on merge to main or on a version tag (see docker-publish.yml).
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # aws first so the long-standing arm of the matrix keeps its slot.
          - cloud: aws
            port: 4566
          - cloud: gcp
            port: 8080
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build jaiscloud-${{ matrix.cloud }} (linux/amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            CLOUD=${{ matrix.cloud }}
            VERSION=ci-${{ github.sha }}
            PORT=${{ matrix.port }}
          tags: jaiscloud-${{ matrix.cloud }}:ci
          cache-from: type=gha,scope=jaiscloud-${{ matrix.cloud }}
          cache-to: type=gha,mode=max,scope=jaiscloud-${{ matrix.cloud }}

      - name: Smoke-test jaiscloud-${{ matrix.cloud }} image
        env:
          IMAGE: jaiscloud-${{ matrix.cloud }}:ci
          CLOUD: ${{ matrix.cloud }}
          PORT: ${{ matrix.port }}
          VERSION: ci-${{ github.sha }}
        run: |
          set -euo pipefail
          version_out=$(docker run --rm "$IMAGE" version)
          printf '%s\n' "$version_out"
          grep -qF "$VERSION" <<<"$version_out"
          docker rm -f "ci-$CLOUD" >/dev/null 2>&1 || true
          # Anonymous host ports: the runner may already be using 4566/8080/4567.
          docker run -d --name "ci-$CLOUD" \
            -p "127.0.0.1::${PORT}" -p 127.0.0.1::4567 \
            "$IMAGE" start --ui
          # Logs on failure are the whole point of the smoke, so clean up on exit.
          trap 'docker logs "ci-$CLOUD" || true; docker rm -f "ci-$CLOUD" >/dev/null 2>&1 || true' EXIT
          rest=$(docker port "ci-$CLOUD" "${PORT}/tcp" | head -1)
          ui=$(docker port "ci-$CLOUD" 4567/tcp | head -1)
          for _ in $(seq 1 30); do
            if curl -fsS --connect-timeout 2 --max-time 3 "http://${rest}/_jaiscloud/health" >/dev/null &&
               [ "$(curl -s --connect-timeout 2 --max-time 3 -o /dev/null -w '%{http_code}' "http://${ui}/ui/")" = "200" ]; then
              break
            fi
            sleep 1
          done
          curl -fsS --connect-timeout 2 --max-time 3 "http://${rest}/_jaiscloud/health"
          ui_code=$(curl -s --connect-timeout 2 --max-time 3 -o /dev/null -w '%{http_code}' "http://${ui}/ui/")
          echo "GET /ui/ -> ${ui_code}"
          test "${ui_code}" = "200"

  # ─── Release config + artifact smoke ───────────────────────────────────────
  # release.yml only runs on a tag, so without this job a broken
  # .goreleaser.yaml, a missing `-tags ui` build or a dropped version ldflag is
  # only discovered when the release is published. Builds a snapshot (no
  # docker, no publish) and runs the release artifact tests against it.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # snapshot version comes from git describe

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Build UI assets
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Build snapshot artifacts (no docker, no publish)
        run: goreleaser release --snapshot --clean --skip=publish,docker

      - name: Release artifact smoke tests
        run: make test-release

  # ─── UI lint + build ───────────────────────────────────────────────────────
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Lint UI
        working-directory: ui
        run: pnpm lint

      - name: Test UI
        working-directory: ui
        run: pnpm test

      - name: Build UI assets
        working-directory: ui
        run: pnpm build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify UI-enabled AWS server builds
        run: go build -tags ui -o /tmp/jaiscloud-ui-aws ./cmd/jaiscloud-aws/

      - name: Verify UI-enabled GCP server builds
        run: go build -tags ui -o /tmp/jaiscloud-ui-gcp ./cmd/jaiscloud-gcp/

  # ─── GCP unit + integration + persistence tests ────────────────────────────

  # Unit tests for the shared engine packages the GCP Dataproc/Spark path
  # depends on (no services required).
  test-gcp-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-gcp-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-gcp-
            ${{ runner.os }}-go-

      - name: Download modules
        run: go mod download

      - name: Run GCP unit tests
        run: go test -race -count=1 ./internal/gcp/... ./internal/sparkhelpers/... ./internal/k8shelpers/... ./internal/platform/... ./internal/executor/...

      - name: GCP statement-coverage ratchet (per-package floor)
        run: make test-gcp-coverage

      - name: Run GCP dev-tool tests
        run: go test -race -count=1 ./tools/gcpstatus/... ./tools/lint/...

      - name: Behavioral-coverage gate (every `ga` service has a suite or reasoned exemption)
        run: make gcp-status-behavioral-gate

      - name: Behavioral-depth gate (every `ga` service records p2–p5 present or dated-exempt)
        run: make gcp-status-depth-gate

      - name: Run GCP convention lint
        run: go run ./tools/lint/gcplint ./internal/gcp/... ./cmd/jaiscloud-gcp

  # Builds and boots jaiscloud-gcp on both REST (8080) and gRPC (8081) ports,
  # then runs the raw-HTTP and per-SDK integration suites against the emulator.
  test-gcp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-gcp-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-gcp-
            ${{ runner.os }}-go-

      - name: Download modules
        run: |
          go mod download
          for mod in tests/integration/gcp/*/go.mod; do
            [ -f "$mod" ] || continue
            (cd "${mod%/go.mod}" && go mod download)
          done

      - name: Build jaiscloud-gcp
        run: go build -o jaiscloud-gcp ./cmd/jaiscloud-gcp/

      - name: Start jaiscloud-gcp (background)
        run: |
          ./jaiscloud-gcp start --port 8080 --grpc-port 8081 > gcp-server.log 2>&1 & echo $! > gcp-server.pid

      - name: Wait for GCP server health
        run: |
          for i in {1..60}; do
            if curl -sfS http://localhost:8080/_jaiscloud/health >/dev/null 2>&1; then
              echo "gcp server healthy"; exit 0
            fi
            sleep 1
          done
          cat gcp-server.log
          exit 1

      - name: Wait for gRPC listener
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8081) 2>/dev/null; then
              echo "grpc listener accepting connections"; exit 0
            fi
            sleep 1
          done
          cat gcp-server.log
          exit 1

      - name: Run raw-HTTP integration tests
        run: go test -race -count=1 -timeout 120s ./tests/integration/gcp/

      - name: Run depth-test kit unit tests
        working-directory: tests/integration/gcp/testdepth
        run: go test -race -count=1 -timeout 120s ./...

      - name: Run GCS REST SDK tests
        working-directory: tests/integration/gcp/sdk
        env:
          STORAGE_EMULATOR_HOST: http://localhost:8080
        run: go test -v -count=1 -timeout 120s ./...

      - name: Run REST SDK tests
        working-directory: tests/integration/gcp/sdk-rest
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Workflows SDK tests
        working-directory: tests/integration/gcp/sdk-workflows
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Dataproc SDK tests
        working-directory: tests/integration/gcp/sdk-dataproc
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Firestore gRPC SDK tests
        working-directory: tests/integration/gcp/sdk-firestore
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8081
        run: go test -v -count=1 -timeout 120s ./...

      - name: Run Firestore Admin gRPC SDK tests
        working-directory: tests/integration/gcp/sdk-firestoreadmin
        env:
          GCP_EMULATOR_ENDPOINT_GRPC: localhost:8081
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Monitoring gRPC SDK tests
        working-directory: tests/integration/gcp/sdk-monitoring
        env:
          MONITORING_EMULATOR_HOST: localhost:8081
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Datastore SDK tests
        working-directory: tests/integration/gcp/sdk-datastore
        env:
          DATASTORE_EMULATOR_HOST: localhost:8081
          GCP_EMULATOR_PROJECT: test-project
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Logging SDK tests
        working-directory: tests/integration/gcp/sdk-logging
        env:
          LOGGING_EMULATOR_HOST: localhost:8081
          GCP_EMULATOR_PROJECT: test-project
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run GCS gRPC SDK tests
        working-directory: tests/integration/gcp/sdk-gcs-grpc
        env:
          STORAGE_EMULATOR_HOST_GRPC: localhost:8081
          GCP_EMULATOR_PROJECT: test-project
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Managed Kafka SDK tests
        working-directory: tests/integration/gcp/sdk-managed-kafka
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
          GCP_EMULATOR_ENDPOINT_GRPC: localhost:8081
          GCP_EMULATOR_PROJECT: test-project
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run BigQuery SDK tests
        working-directory: tests/integration/gcp/sdk-bigquery
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Metastore SDK tests
        working-directory: tests/integration/gcp/sdk-metastore
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
          JAISCLOUD_GCP_HMS_PORT: 9083
        run: go test -v -race -count=1 -timeout 300s ./...

      - name: Run BigLake Iceberg SDK tests
        working-directory: tests/integration/gcp/sdk-iceberg
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -count=1 -timeout 120s ./...

      - name: Run Eventarc SDK tests
        working-directory: tests/integration/gcp/sdk-eventarc
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -race -count=1 -timeout 300s ./...

      - name: Run Cloud DNS SDK tests
        working-directory: tests/integration/gcp/sdk-clouddns
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -count=1 -timeout 120s ./...

      - name: Run Cloud Scheduler SDK tests
        working-directory: tests/integration/gcp/sdk-scheduler
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Cloud Tasks SDK tests
        working-directory: tests/integration/gcp/sdk-tasks
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Memorystore SDK tests
        working-directory: tests/integration/gcp/sdk-memorystore
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -count=1 -timeout 120s ./...

      - name: Run Cloud SQL SDK tests
        working-directory: tests/integration/gcp/sdk-cloudsql
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -count=1 -timeout 120s ./...

      - name: Run Compute Engine SDK tests
        working-directory: tests/integration/gcp/sdk-compute
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run GKE Container SDK tests
        working-directory: tests/integration/gcp/sdk-container
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Cloud Run SDK tests
        working-directory: tests/integration/gcp/sdk-run
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Run Pub/Sub SDK tests
        working-directory: tests/integration/gcp/sdk-pubsub
        env:
          PUBSUB_EMULATOR_HOST: localhost:8081
          GCP_EMULATOR_PROJECT: test-project
        run: go test -v -race -count=1 -timeout 180s ./...

      - name: Upload GCP server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-server-log
          path: gcp-server.log

      - name: Stop GCP server
        if: always()
        run: |
          if [ -f gcp-server.pid ]; then kill $(cat gcp-server.pid) || true; fi

  # Wire-conformance gate: records a transcript from a freshly-built emulator and
  # validates every response (and error envelope) against the vendored official
  # Discovery schemas. Fails the build on any high-severity divergence, so a
  # regression in the emulator's wire contract can't merge silently.
  test-gcp-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-gcp-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-gcp-
            ${{ runner.os }}-go-

      - name: Download modules
        run: |
          go mod download
          for mod in tests/gcpconformance/grpc/go.mod; do
            [ -f "$mod" ] || continue
            (cd "${mod%/go.mod}" && go mod download)
          done

      - name: Build jaiscloud-gcp
        run: go build -o jaiscloud-gcp ./cmd/jaiscloud-gcp/

      - name: Start jaiscloud-gcp (ephemeral)
        run: |
          ./jaiscloud-gcp start --port 8080 --grpc-port 8081 --ephemeral > gcp-conformance.log 2>&1 & echo $! > gcp-conformance.pid

      - name: Wait for GCP server health
        run: |
          for i in {1..60}; do
            if curl -sfS http://localhost:8080/_jaiscloud/health >/dev/null 2>&1; then
              echo "gcp server healthy"; exit 0
            fi
            sleep 1
          done
          cat gcp-conformance.log
          exit 1

      - name: Record wire transcript against the live emulator
        env:
          GCP_CONFORMANCE_RECORD: "1"
          GCP_CONFORMANCE_ENDPOINT: http://localhost:8080
        run: go test -tags gcp_conformance -run TestRecord -v ./tests/gcpconformance/

      - name: Validate responses against Discovery schemas (fails on high severity)
        run: go test -tags gcp_conformance -run TestTranscriptsConform -v ./tests/gcpconformance/

      # Differential record/replay: replays the committed real-GCP goldens
      # against the already-running emulator and writes a divergence report.
      # Offline and credential-free; strict mode fails the build on any open
      # (real-bug) divergence at any severity, so a regression against
      # real GCP can't merge silently. The regex is anchored so this REST step
      # runs only the REST sets; the gRPC-only replays run after the gRPC
      # listener is up (below). It also runs the golden-hygiene/contract guards
      # (assertGoldensClean, manifest, scenario-validity) for the curated, tour,
      # error-tour and BigQuery sets.
      - name: Run GCP differential replay (offline; strict)
        env:
          GCP_DIFFERENTIAL_STRICT: "1"
          GCP_DIFFERENTIAL_STRICT_SEVERITY: "low"
          GCP_DIFFERENTIAL_REQUIRE_GOLDENS: "1"
        run: go test -tags gcp_differential -count=1 -v -run '^(TestReplay|TestGoldensAreClean|TestGoldenManifest|TestReplayTour|TestTourGoldensAreClean|TestTourGoldenManifest|TestTourScenariosValid|TestReplayErrors|TestErrorGoldensAreClean|TestErrorGoldenManifest|TestErrorScenariosValid|TestReplayBQSQL|TestBQSQLGoldensAreClean|TestBQSQLGoldenManifest|TestBQSQLScenariosValid)$' ./tests/gcpdifferential/

      - name: Wait for gRPC listener
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/8081) 2>/dev/null; then
              echo "grpc listener accepting connections"; exit 0
            fi
            sleep 1
          done
          cat gcp-conformance.log
          exit 1

      # AUD6-1: replays the committed real-GCP gRPC goldens (Cloud Datastore,
      # Firestore, Logging, Monitoring) against the emulator's gRPC listener and
      # diffs them with the shared normalize/triage engine. Offline and
      # credential-free; strict mode fails on any open (real-bug) divergence.
      # It also runs the gRPC SDK-tour replay (REST-tour replay is in the step
      # above) plus its hygiene/contract guards.
      - name: Run GCP gRPC differential replay (offline; strict)
        env:
          GCP_DIFFERENTIAL_STRICT: "1"
          GCP_DIFFERENTIAL_STRICT_SEVERITY: "low"
          GCP_DIFFERENTIAL_REQUIRE_GOLDENS: "1"
          GCP_DIFFERENTIAL_GRPC_ENDPOINT: localhost:8081
        run: go test -tags gcp_differential -count=1 -v -run '^(TestReplayGRPC|TestGRPCGoldensAreClean|TestGRPCGoldensAreMarked|TestGRPCGoldenManifest|TestGRPCScenariosValid|TestGRPCNormalizerFoldsVolatile|TestReplayTourGRPC|TestTourGRPCGoldensAreClean|TestTourGRPCScenariosValid)$' ./tests/gcpdifferential/

      - name: Run gRPC message-level conformance (official clients)
        working-directory: tests/gcpconformance/grpc
        env:
          GCP_EMULATOR_ENDPOINT_GRPC: localhost:8081
        run: go test -count=1 -v -timeout 180s ./...

      # Cross-transport parity: drives each dual service's create/get/list/
      # mutate/delete flow and reads every resource back over BOTH transports
      # (REST :8080 + gRPC :8081), diffing the normalized bodies so a field one
      # adapter drops cannot pass. Fails on any un-allowlisted divergence.
      - name: Run REST↔gRPC cross-transport parity (official clients)
        env:
          GCP_EMULATOR_ENDPOINT_REST: http://localhost:8080
          GCP_EMULATOR_ENDPOINT_GRPC: localhost:8081
        run: go test -count=1 -tags gcp_conformance,gcp_differential,gcp_parity -v -timeout 300s ./tests/gcpparity/

      # Reporting suite: runs the real gcloud CLI (preinstalled on the runner)
      # against the already-running emulator. It skips cleanly if gcloud is not
      # on PATH and only fails on regressions in commands expected to pass —
      # documented emulator/gcloud incompatibilities are recorded, not fatal.
      - name: Run gcloud CLI client-conformance (reporting)
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080
          GCP_EMULATOR_PROJECT: jaiscloud-project
        run: go test -tags gcloud_conformance -count=1 -v -timeout 600s ./tests/gcpconformance/gcloud/

      # Python client-conformance: drives the official google-cloud-* Python
      # clients against the same running emulator — a separate language/codegen
      # path from the Go SDKs and gcloud.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python client-conformance deps
        run: |
          python -m venv tests/clients/python/.venv
          tests/clients/python/.venv/bin/python -m pip install --upgrade pip
          tests/clients/python/.venv/bin/pip install -r tests/clients/python/requirements.txt

      - name: Run Python SDK client-conformance
        env:
          PROJECT_ID: jaiscloud-project
          EMULATOR_REST: http://localhost:8080
          EMULATOR_GRPC: localhost:8081
        run: tests/clients/python/.venv/bin/python -m pytest -v tests/clients/python

      - name: Check the fidelity matrix is up to date
        run: make check-gcp-fidelity-matrix

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-conformance-report
          path: |
            tests/gcpconformance/testdata/report/
            tests/gcpconformance/grpc/testdata/report/
            tests/gcpconformance/gcloud/testdata/report/
            tests/gcpdifferential/testdata/report/
            tests/gcpdifferential/testdata/report-grpc/
            tests/clients/python/report/

      - name: Upload GCP server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-conformance-server-log
          path: gcp-conformance.log

      - name: Stop GCP server
        if: always()
        run: |
          if [ -f gcp-conformance.pid ]; then kill $(cat gcp-conformance.pid) || true; fi

  # Persistence-mode tests backed by a Postgres service container.
  test-gcp-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jaiscloud
          POSTGRES_PASSWORD: jaiscloud
          POSTGRES_DB: jaiscloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-gcp-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-gcp-
            ${{ runner.os }}-go-

      - name: Download modules
        run: |
          go mod download
          (cd tests/persistent_mode/gcp/parity-grpc && go mod download)
          (cd tests/persistent_mode/gcp/hms && go mod download)

      - name: Build jaiscloud-gcp
        run: go build -o jaiscloud-gcp ./cmd/jaiscloud-gcp/

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/localhost/5432) 2>/dev/null; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready"; exit 1

      - name: Run GCP persistence tests
        env:
          JAISCLOUD_DSN: postgres://jaiscloud:jaiscloud@localhost:5432/jaiscloud
          JAISCLOUD_GCP_BIN: ${{ github.workspace }}/jaiscloud-gcp
        run: >
          go test -tags gcp_persistence -p 1 -count=1 -timeout 300s
          ./tests/persistent_mode/gcp/...
          ./internal/gcp/store/... ./internal/gcp/service/resourcemanager/...
          ./internal/gcp/provider/bigquery/...

      - name: Run GCP gRPC persistence parity tests
        working-directory: tests/persistent_mode/gcp/parity-grpc
        env:
          JAISCLOUD_DSN: postgres://jaiscloud:jaiscloud@localhost:5432/jaiscloud
          JAISCLOUD_GCP_BIN: ${{ github.workspace }}/jaiscloud-gcp
          GCP_EMULATOR_PROJECT: test-project
          DATASTORE_EMULATOR_HOST: localhost:8081
          LOGGING_EMULATOR_HOST: localhost:8081
          MONITORING_EMULATOR_HOST: localhost:8081
        run: go test -tags gcp_persistence -p 1 -count=1 -timeout 300s ./...

      - name: Run GCP Hive Metastore persistence tests
        working-directory: tests/persistent_mode/gcp/hms
        env:
          JAISCLOUD_DSN: postgres://jaiscloud:jaiscloud@localhost:5432/jaiscloud
          JAISCLOUD_GCP_BIN: ${{ github.workspace }}/jaiscloud-gcp
        run: go test -tags gcp_persistence -p 1 -count=1 -timeout 300s ./...

  # The opt-in async long-running-operation mode is a different code path from
  # the synchronous default (operations are persisted in flight and settled on
  # operations.get), and nothing else in CI turns it on. Run the live async-LRO
  # gate (mirrors `make test-lro-async-gcp`) so a regression in the async surface
  # is caught without a k3d cluster.
  test-gcp-lro-async:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-gcp-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-gcp-
            ${{ runner.os }}-go-

      - name: Download modules
        run: |
          go mod download
          for mod in tests/integration/gcp/*/go.mod; do
            [ -f "$mod" ] || continue
            (cd "${mod%/go.mod}" && go mod download)
          done

      - name: Build jaiscloud-gcp
        run: go build -o jaiscloud-gcp ./cmd/jaiscloud-gcp/

      - name: Start jaiscloud-gcp (async LRO, background)
        run: |
          JAISCLOUD_LRO_MODE=async JAISCLOUD_LRO_DELAY=2s JAISCLOUD_GCP_PROJECT_ID=proj \
            ./jaiscloud-gcp start --port 8080 --grpc-port 8081 --ephemeral > gcp-lro.log 2>&1 & echo $! > gcp-lro.pid

      - name: Wait for GCP server health
        run: |
          for i in {1..60}; do
            if curl -sfS http://localhost:8080/_jaiscloud/health >/dev/null 2>&1; then
              echo "gcp server healthy (async LRO, delay 2s)"; exit 0
            fi
            sleep 1
          done
          cat gcp-lro.log
          exit 1

      - name: Run async-LRO integration tests
        env:
          JAISCLOUD_LRO_ASYNC: '1'
        run: go test -race -count=1 -timeout 120s ./tests/integration/gcp/ -run TestLROAsync

      - name: Run Cloud Run async-LRO SDK tests
        working-directory: tests/integration/gcp/sdk-run
        env:
          GCP_EMULATOR_ENDPOINT: http://localhost:8080/
          JAISCLOUD_LRO_ASYNC: '1'
        run: go test -v -race -count=1 -timeout 240s ./...

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-lro-server-log
          path: gcp-lro.log
