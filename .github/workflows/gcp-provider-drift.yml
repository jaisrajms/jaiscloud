name: GCP provider / module drift

# FC6 — the weekly provider-drift gate.
#
# The module gates pin a *module* commit but resolve the hashicorp/google
# provider from a version range, so a new provider release can change which
# attributes a module sends. This job bumps the pins, re-runs the module gates
# with the request capture enabled, diffs the provider schema against the
# committed snapshot (docs/fidelity/terraform-provider-schema.json) and opens an
# issue with the schema diff when anything moved. It is deliberately NOT a
# pull_request check: it clones twenty consumer module repos and runs
# twenty-one module cases (two of them plan-only; pubsub-topic reuses the
# pubsub checkout).
on:
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Provider schema + pinned module drift
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.3'
          terraform_wrapper: false

      - name: Cache consumer module checkouts
        uses: actions/cache@v4
        with:
          path: ~/.cache/terraform-modules
          key: tf-modules-${{ runner.os }}-c7effc0be0f4-6cf1860-ef6e0eda7032-50d170b9ebfc-35cd6de8e647-5415d5ccca28-9f2e26ae3b73-8c3e37951bb4-4ce640a2a519-e11db0dcd597-77fca80ccd6a-4c431381b5d8-ece5c3e87412-ba7dbc000bfb-56c7c7ed630f-570caafff32d-9b9eacfa2b4f-75b57dc6838e-1616a282bbf4-a19597ac18ad
          restore-keys: |
            tf-modules-${{ runner.os }}-

      - name: Clone the pinned consumer modules
        run: |
          set -euo pipefail
          clone() {
            repo="$1"; commit="$2"; url="${3:-https://github.com/terraform-google-modules/$repo}"
            dir="$HOME/.cache/terraform-modules/$repo"
            if [ ! -d "$dir/.git" ]; then
              git clone --quiet "$url" "$dir"
            fi
            git -C "$dir" fetch --quiet --depth 1 origin "$commit"
            git -C "$dir" checkout --quiet "$commit"
          }
          clone terraform-google-cloud-storage c7effc0be0f4
          clone terraform-google-pubsub 6cf1860
          clone terraform-google-kms ef6e0eda7032
          clone terraform-google-firestore 50d170b9ebfc https://github.com/GoogleCloudPlatform/terraform-google-firestore
          clone terraform-google-cloud-dns 35cd6de8e647
          clone terraform-google-memorystore 5415d5ccca28
          clone terraform-google-event-function 9f2e26ae3b73
          clone terraform-google-cloud-operations 8c3e37951bb4
          clone terraform-google-cloud-run 4ce640a2a519 https://github.com/GoogleCloudPlatform/terraform-google-cloud-run
          clone terraform-google-bigquery e11db0dcd597
          clone terraform-google-secret-manager 77fca80ccd6a https://github.com/GoogleCloudPlatform/terraform-google-secret-manager
          clone terraform-google-cloud-workflows 4c431381b5d8 https://github.com/GoogleCloudPlatform/terraform-google-cloud-workflows
          clone terraform-google-cloud-scheduler ece5c3e87412 https://github.com/GoogleCloudPlatform/terraform-google-cloud-scheduler
          clone terraform-google-cloud-tasks ba7dbc000bfb https://github.com/GoogleCloudPlatform/terraform-google-cloud-tasks
          clone terraform-google-dataproc 56c7c7ed630f https://github.com/GoogleCloudPlatform/terraform-google-dataproc
          clone terraform-google-service-accounts 570caafff32d
          clone terraform-google-iam 9b9eacfa2b4f
          clone terraform-google-sql-db 75b57dc6838e
          clone terraform-google-cloud-datastore 1616a282bbf4
          clone terraform-google-kubernetes-engine a19597ac18ad

      - name: Build the capture tool
        run: go build -o bin/tfcapture ./tools/tfcapture

      - name: Run the module gates with the request capture
        run: |
          set -uo pipefail
          : > drift-report.md
          rc=0
          for case in pubsub pubsub-topic storage memorystore functions clouddns cloud-operations kms firestore cloudrun bigquery secret-manager workflows scheduler tasks dataproc service-accounts iam sql-db gke datastore; do
            echo "### module case: $case" | tee -a drift-report.md
            if ! make "test-gcp-terraform-$case" >>"$case.log" 2>&1; then
              echo "FAILED: make test-gcp-terraform-$case" | tee -a drift-report.md
              tail -40 "$case.log" >>drift-report.md
              rc=1
            elif grep -q '^SKIP' "$case.log"; then
              # A SKIP means the module checkout or terraform is missing: the
              # gate ran nothing, so it must not count as a pass.
              echo "SKIPPED: make test-gcp-terraform-$case ran nothing" | tee -a drift-report.md
              tail -5 "$case.log" >>drift-report.md
              rc=1
            else
              echo "PASS" >>drift-report.md
            fi
          done
          exit $rc

      - name: Provider schema drift
        run: |
          set -uo pipefail
          mkdir -p /tmp/schema && cd /tmp/schema
          cat > main.tf <<'EOF'
          terraform {
            required_providers {
              google = { source = "hashicorp/google", version = ">= 6.2, < 9" }
            }
          }
          EOF
          terraform init -backend=false -input=false -no-color >/dev/null
          terraform providers schema -json > full.json
          cd "$GITHUB_WORKSPACE"
          bin/tfcapture -schema /tmp/schema/full.json \
            -snapshot docs/fidelity/terraform-provider-schema.json \
            -resources google_storage_bucket,google_pubsub_topic,google_pubsub_subscription,google_firestore_database,google_kms_key_ring,google_kms_crypto_key,google_dns_managed_zone,google_cloudfunctions_function,google_cloudfunctions2_function,google_redis_instance,google_monitoring_uptime_check_config,google_monitoring_alert_policy
          if git diff --quiet -- docs/fidelity/terraform-provider-schema.json; then
            echo "provider schema unchanged" | tee -a drift-report.md
          else
            {
              echo "### provider schema drift"
              echo '```diff'
              git diff -- docs/fidelity/terraform-provider-schema.json
              echo '```'
            } | tee -a drift-report.md
            # A drifted schema means an attribute may be unclassified; the
            # capture gate above already ran against the old mapping, so fail
            # loudly and let the issue carry the diff.
            exit 1
          fi

      - name: Terraform coverage inventory drift
        run: |
          set -uo pipefail
          # Regenerate the *full* snapshot the coverage gate reads, then check
          # the committed inventory against it. A new provider resource type
          # with no scope rule makes the check fail (an unclassified type must
          # not disappear from the measurement).
          go run ./tools/tfcoverage -raw-schema /tmp/schema/full.json \
            -write-snapshot docs/fidelity/terraform-provider-schema-full.json
          set +e
          out="$(go run ./tools/tfcoverage -check 2>&1)"; rc=$?
          set -e
          if [ "$rc" -eq 0 ] && git diff --quiet -- docs/fidelity/terraform-provider-schema-full.json; then
            echo "terraform coverage inventory unchanged" | tee -a drift-report.md
            exit 0
          fi
          {
            echo "### terraform coverage inventory drift"
            echo '```'
            git diff --stat -- docs/fidelity/terraform-provider-schema-full.json || true
            echo "$out"
            echo '```'
            echo "Regenerate with 'make gen-gcp-terraform-provider-schema-full' and 'make gen-gcp-terraform-coverage', then classify any new resource type in tools/tfcoverage/scope.yaml."
          } | tee -a drift-report.md
          exit 1

      - name: Upload the drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-provider-drift-report
          path: |
            drift-report.md
            *.log

      - name: Open (or update) a drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="GCP provider/module drift ($(date +%F))"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq 'length' | grep -q '^0$'; then
            {
              echo "The weekly provider-drift gate failed. Schema diff and gate logs follow."
              echo
              cat drift-report.md || true
            } > issue-body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md
          else
            echo "an open drift issue already exists; see the run log"
          fi
