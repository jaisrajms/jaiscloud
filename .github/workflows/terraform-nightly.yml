name: GCP Terraform nightly

# TF0 — the scheduled aggregate of the Terraform/OpenTofu compatibility suite.
#
# Not a pull_request check: it downloads the hashicorp/google provider and runs
# the fixture plus every pinned module case (twenty-one), the lifecycle depth
# gate (TF5: import/refresh/replace/drift/negative/parallel) and the composition
# patterns (TF4: project bootstrap, CMEK everywhere, the event-driven chain
# — Scheduler/Pub/Sub/functions plus an Eventarc GCS trigger — the data-lake
# stack of buckets/BigQuery/Dataproc-on-GKE/Metastore, and the multi-environment
# stack of one module over two workspaces plus a shared-project provider alias),
# twice (Terraform and OpenTofu), and replays the TF6 differential goldens that
# were recorded against real GCP. The per-PR signal stays offline
# (`make gcp-ci-preflight`, the provider-capture self-test, the static coverage
# gate); this job catches provider-registry drift and module/gate regressions on
# a schedule.
#
# STRICT=1 is deliberate: a SKIP (missing terraform/tofu or a module checkout)
# is a broken gate, not a pass.
on:
  schedule:
    - cron: '41 4 * * *' # daily 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  terraform:
    name: Terraform (fixture + 21 module cases + lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The `runner` context is not available in a job-level `env:` (only in
      # step-level env/with/if/run), so this must not use `${{ runner.temp }}`:
      # it makes the whole workflow file invalid before any job can start.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.3'
          terraform_wrapper: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache provider plugin + consumer module checkouts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.tf-plugin-cache
            ~/.cache/terraform-modules
          key: tf-nightly-${{ runner.os }}-${{ hashFiles('tests/integration/gcp/terraform/clone-modules.sh') }}
          restore-keys: |
            tf-nightly-${{ runner.os }}-

      - name: Clone the pinned consumer modules
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          # The pins and the clone strategy live in one script shared with the
          # weekly drift job; the module cache key hashes it.
          tests/integration/gcp/terraform/clone-modules.sh

      - name: Run the Terraform aggregate
        run: make test-gcp-terraform-all STRICT=1

      - name: Run the lifecycle depth gate
        run: make test-gcp-terraform-lifecycle STRICT=1

      - name: Run the composition patterns
        run: make test-gcp-terraform-patterns STRICT=1

      - name: Replay the real-GCP differential goldens
        run: make test-gcp-terraform-differential STRICT=1

      - name: Upload the per-case logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-terraform-nightly
          path: |
            /tmp/jaiscloud-gcp-terraform-all/summary.md
            /tmp/jaiscloud-gcp-terraform-all/summary.tsv
            /tmp/jaiscloud-gcp-terraform-all/*.log
            /tmp/jaiscloud-gcp-terraform-all.log
            /tmp/jaiscloud-gcp-terraform-lifecycle/summary.md
            /tmp/jaiscloud-gcp-terraform-lifecycle/summary.tsv
            /tmp/jaiscloud-gcp-terraform-lifecycle/*.log
            /tmp/jaiscloud-gcp-terraform-lifecycle/*-import.tsv
            /tmp/jaiscloud-gcp-terraform-lifecycle.log
            /tmp/jaiscloud-gcp-terraform-patterns/summary.md
            /tmp/jaiscloud-gcp-terraform-patterns/summary.tsv
            /tmp/jaiscloud-gcp-terraform-patterns/*.log
            /tmp/jaiscloud-gcp-terraform-patterns.log
          if-no-files-found: ignore

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Terraform nightly failing (Terraform)"
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat /tmp/jaiscloud-gcp-terraform-all/summary.md 2>/dev/null || echo "no summary (the job failed before the cases ran)"
            echo '```'
            echo
            echo 'The artifact `gcp-terraform-nightly` carries the per-case logs.'
          } > issue-body.md
          num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$num" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md
          else
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          fi

  opentofu:
    name: OpenTofu (fixture + 21 module cases + lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The `runner` context is not available in a job-level `env:` (only in
      # step-level env/with/if/run), so this must not use `${{ runner.temp }}`:
      # it makes the whole workflow file invalid before any job can start.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.12.6'
          tofu_wrapper: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache provider plugin + consumer module checkouts
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.tf-plugin-cache
            ~/.cache/terraform-modules
          key: tf-nightly-tofu-${{ runner.os }}-${{ hashFiles('tests/integration/gcp/terraform/clone-modules.sh') }}
          restore-keys: |
            tf-nightly-tofu-${{ runner.os }}-

      - name: Clone the pinned consumer modules
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          # The pins and the clone strategy live in one script shared with the
          # weekly drift job; the module cache key hashes it.
          tests/integration/gcp/terraform/clone-modules.sh

      - name: Run the OpenTofu aggregate
        run: make test-gcp-terraform-all TF_BIN=tofu STRICT=1

      - name: Run the lifecycle depth gate
        run: make test-gcp-terraform-lifecycle TF_BIN=tofu STRICT=1

      - name: Run the composition patterns
        run: make test-gcp-terraform-patterns TF_BIN=tofu STRICT=1

      - name: Upload the per-case logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-opentofu-nightly
          path: |
            /tmp/jaiscloud-gcp-terraform-all/summary.md
            /tmp/jaiscloud-gcp-terraform-all/summary.tsv
            /tmp/jaiscloud-gcp-terraform-all/*.log
            /tmp/jaiscloud-gcp-terraform-all.log
            /tmp/jaiscloud-gcp-terraform-lifecycle/summary.md
            /tmp/jaiscloud-gcp-terraform-lifecycle/summary.tsv
            /tmp/jaiscloud-gcp-terraform-lifecycle/*.log
            /tmp/jaiscloud-gcp-terraform-lifecycle/*-import.tsv
            /tmp/jaiscloud-gcp-terraform-lifecycle.log
            /tmp/jaiscloud-gcp-terraform-patterns/summary.md
            /tmp/jaiscloud-gcp-terraform-patterns/summary.tsv
            /tmp/jaiscloud-gcp-terraform-patterns/*.log
            /tmp/jaiscloud-gcp-terraform-patterns.log
          if-no-files-found: ignore

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Terraform nightly failing (OpenTofu)"
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            cat /tmp/jaiscloud-gcp-terraform-all/summary.md 2>/dev/null || echo "no summary (the job failed before the cases ran)"
            echo '```'
            echo
            echo 'The artifact `gcp-opentofu-nightly` carries the per-case logs.'
          } > issue-body.md
          num="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$num" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md
          else
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          fi
