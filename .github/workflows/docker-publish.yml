name: Build and Publish Images

on:
  push:
    branches: [main]  # tag releases are handled by GoReleaser in release.yml

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ─── Resolve version once ──────────────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

  # ─── Build and push one image per cloud ────────────────────────────────────
  build-and-push:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cloud: aws
            port: 4566
          - cloud: gcp
            port: 8080
    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push jaiscloud-${{ matrix.cloud }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}
            CLOUD=${{ matrix.cloud }}
            PORT=${{ matrix.port }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/jaiscloud-${{ matrix.cloud }}:${{ needs.setup.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/jaiscloud-${{ matrix.cloud }}:latest
          cache-from: type=gha,scope=jaiscloud-${{ matrix.cloud }}
          cache-to: type=gha,mode=max,scope=jaiscloud-${{ matrix.cloud }}
