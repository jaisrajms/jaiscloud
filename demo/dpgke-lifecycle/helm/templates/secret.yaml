{{- /*
The credential, and only the credential. Rendered unless the reader points at a
Secret they made themselves (`credentials.existingSecret`), in which case this
object does not exist and job.yaml reads the same key out of theirs.

The value is whatever values.yaml / --set says — never generated — so two
renders are byte-identical and a token is never invented. Empty is a valid and
expected state: against the emulator the clients use NoCredentials, and on real
GCP the pod would use Workload Identity/ADC instead of a static token.
*/ -}}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dpgke.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dpgke.labels" . | nindent 4 }}
type: Opaque
# stringData, not data: the value is a token as typed, and Helm would otherwise
# have to base64 it in the template.
stringData:
  GOOGLE_OAUTH_ACCESS_TOKEN: {{ .Values.credentials.accessToken | quote }}
{{- end }}
