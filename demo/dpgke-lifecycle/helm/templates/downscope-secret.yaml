{{- /*
The two downscoped tokens, and only them (DGD5). Rendered only when a values
file / --set supplies one, and not at all when `downscope.existingSecret` names
a Secret a minting stage writes; the Job reads both keys as optional, so an
absent Secret means "the app exchanges its own pair at /v1/token".

Nothing here is generated. A Credential Access Boundary token is minted per run
by an STS token-exchange (the demo does it in ../java), never at render time, so
two renders stay byte-identical and no credential is invented by the chart.
*/ -}}
{{- if and (not .Values.downscope.existingSecret) (or .Values.downscope.inputToken .Values.downscope.outputToken) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dpgke.downscopeSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dpgke.labels" . | nindent 4 }}
type: Opaque
# stringData, not data: the tokens are the opaque strings the exchange returned,
# and the keys are the environment variable names the app reads.
stringData:
  DGD5_INPUT_TOKEN: {{ .Values.downscope.inputToken | quote }}
  DGD5_OUTPUT_TOKEN: {{ .Values.downscope.outputToken | quote }}
{{- end }}
