# GCP per-target mutation-score floor (TD19) — a ratchet, not a target.
#
# Regenerate a target's floor from a fresh run with
# `make test-gcp-mutation-update PKG=<target>`; the update RAISES a recorded floor
# but refuses to LOWER one unless ALLOW_LOWER=1 is set, so an assertion-strength
# drop cannot be laundered by re-running it. The gate
# (`make test-gcp-mutation-ratchet PKG=<target>`) fails when the measured mutation
# score (MSI) drops more than 0.5pp below its floor, or when the target has no
# entry here. The spike is local only (a full package run is minutes), so this
# gate runs on demand rather than in PR CI.
#
# package: repo-relative mutation target passed to `make test-gcp-mutation`
#   — a Go package directory, or a single file within one.
# min_msi_percent: mutation-score floor (killed / total mutants), two decimals.
#
# `internal/gcp/service/datastore/query.go` is file-scoped (TD21) because the
# whole-package token above is the TD13/TD19 measurement and a re-run is hours,
# not minutes: several `gql.go` lexer mutants burn the full 60s exec timeout.
# TD21's surface — the value comparison and the filter validation — is therefore
# gated by the file-scoped entry, which was measured at 81.82%.
#
# DC10 (depth-closure) adds the two shared surfaces the depth suites' paging and
# error assertions ride on: `internal/gcp/paging` (the pageSize/pageToken cursor
# walk every Wave-2 p4 walk drives) and `internal/gcp/gcperr` (the google.rpc
# status ↔ HTTP mapping behind every p3 error-envelope assertion). The floors are
# the scores measured when DC10 landed.
targets:
  - package: internal/gcp/adapter/jsoncodec.go
    min_msi_percent: 95.57
  - package: internal/gcp/gcperr
    min_msi_percent: 91.41
  - package: internal/gcp/paging
    min_msi_percent: 67.8
  - package: internal/gcp/service/datastore
    min_msi_percent: 68.7
  - package: internal/gcp/service/datastore/query.go
    min_msi_percent: 81.82
