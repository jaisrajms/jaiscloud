# Curated fidelity overrides for the GCP emulator — the published contract.
#
# tools/fidelitygen merges these over the state it derives from the emulator's
# registries and wire-conformance evidence. Overrides may only DOWNGRADE a cell
# unless `allow_upgrade: true` is set.
#
# Rules enforced by the generator (it fails on violation):
#   - every service / operation must exist in the enumerated registry;
#   - `state` must be one of: ga | limited | preview | unsupported;
#   - any non-`ga` state MUST carry a `reason`;
#   - any `ga` override MUST set `allow_upgrade: true`.

# Applied to every operation of a service unless overridden per-operation.
defaults:
  bigquery:
    state: limited
    reason: "documented Standard SQL subset (one pure-Go SQLite engine in both memory and --dsn modes, docs/gcp/bigquery-sql-engine.md §5); DDL/DML jobs complete synchronously and paging/getQueryResults snapshot semantics are simplified; load jobs cover one or more gs:// objects (including a single-'*' wildcard) or an uploaded file (multipart / resumable media session) of NEWLINE_DELIMITED_JSON, CSV, Parquet or Avro, with a supplied schema, an embedded file schema, or autodetect; gzip-compressed CSV/JSON is auto-detected; useAvroLogicalTypes selects logical vs raw Avro types (ORC, Parquet/Avro map/decimal shapes, and Avro unions with more than one non-null type fail loud)"
  cloudsql:
    state: limited
    reason: "metadata-only over ResourceStore (no control plane)"
  compute:
    state: limited
    reason: "metadata-only over ResourceStore (no control plane)"
  clouddns:
    state: limited
    reason: "metadata-only over ResourceStore (no private DNS resolution)"
  memorystore:
    state: limited
    reason: "metadata-only over ResourceStore (no data plane)"
  iceberg:
    state: preview
    reason: "BigLake Iceberg REST catalog; no official Discovery document"

operations:
  - service: dataproc
    operation: Dataproc.SubmitJob
    state: ga
    allow_upgrade: true
    reason: "covered by the k3d Lakehouse e2e (real Spark on Kubernetes, GKE virtualClusterConfig + driver output in GCS)"

  # Firestore Admin: composite-index CRUD and the control plane (databases,
  # collection-group fields, backup schedules, backups, user creds) are verified
  # end-to-end by the official cloud.google.com/go/firestore/apiv1/admin client
  # conformance suite (gRPC) and by the REST wire-conformance probes (the REST
  # control plane is served under the `firestore` service descriptor on
  # firestore.googleapis.com/v1), so their cells derive `ga` with no override. The
  # data-plane / disaster-recovery RPCs remain explicit Unimplemented stubs
  # (recorded as debt in the GA-fidelity wave plan, GA12-D1..D5).

  # Explicit Unimplemented stubs: enumerated but not implemented.
  # Firestore Admin data-plane / disaster-recovery RPCs. ExportDocuments and
  # ImportDocuments need a Cloud Storage bucket plus Firestore's opaque export
  # format; RestoreDatabase/CloneDatabase need a real backup snapshot and a
  # second database; BulkDeleteDocuments needs a real data-plane delete. The
  # emulator fails loud rather than fabricate a result (GA12-D1..D5).
  - service: firestoreadmin
    operation: ExportDocuments
    state: unsupported
    reason: "requires a GCS bucket + Firestore export format; explicit Unimplemented stub"
  - service: firestoreadmin
    operation: ImportDocuments
    state: unsupported
    reason: "requires a GCS bucket + Firestore export format; explicit Unimplemented stub"
  - service: firestoreadmin
    operation: RestoreDatabase
    state: unsupported
    reason: "requires a real backup snapshot; explicit Unimplemented stub"
  - service: firestoreadmin
    operation: CloneDatabase
    state: unsupported
    reason: "requires a real data-plane copy; explicit Unimplemented stub"
  - service: firestoreadmin
    operation: BulkDeleteDocuments
    state: unsupported
    reason: "requires a real data-plane delete; explicit Unimplemented stub"
  - service: clouddns
    operation: CloudDNS.Unimplemented
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: cloudsql
    operation: CloudSQL.Unimplemented
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: compute
    operation: Compute.Unimplemented
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: metastore
    operation: Metastore.ExportMetadata
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: metastore
    operation: Metastore.RestoreService
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: metastore
    operation: Metastore.QueryMetadata
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: metastore
    operation: Metastore.MoveTableToDatabase
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: metastore
    operation: Metastore.AlterMetadataResourceLocation
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: dataproc
    operation: Dataproc.DiagnoseCluster
    state: unsupported
    reason: "explicit Unimplemented stub"
  # gRPC DiagnoseCluster is the same explicit Unimplemented stub over the
  # ClusterController surface (the descriptor name carries no "Dataproc." prefix).
  - service: dataproc
    operation: DiagnoseCluster
    state: unsupported
    reason: "explicit Unimplemented stub"
  # Cloud Functions v2 ListRuntimes is implemented over the shared runtime
  # catalog on both transports (REST GET /v2/.../runtimes + gRPC ListRuntimes),
  # verified by the official gRPC client conformance suite, so it needs no
  # override.
  #
  # Cloud Functions REST common-API methods: GetLocation is the shared
  # google.cloud.location.Locations method and CancelOperation/DeleteOperation/
  # WaitOperation are the shared google.longrunning.Operations methods (the Cloud
  # Functions RPC reference lists both interfaces). The service Discovery
  # document deliberately does not enumerate common-API methods, so the
  # classifier reports these as limited ("no matching Discovery method") even
  # though the handlers are served and wire-tested (DELETE /v2/.../operations/{id},
  # POST /v2/.../operations/{id}:cancel, POST /v2/.../operations/{id}:wait,
  # GET /v1/projects/{p}/locations/{l}); the cells are therefore upgraded to ga.
  # WaitOperation is gRPC-only in the canonical proto (no HTTP annotation); REST
  # :wait is an emulator extension, kept for symmetry with the other LRO verbs.
  - service: functions
    operation: Function.GetLocation
    state: ga
    allow_upgrade: true
    reason: "shared google.cloud.location.Locations.GetLocation common API; not enumerated in the service Discovery document, but served (GET /v1/projects/{p}/locations/{l}) and wire-tested"
  - service: functions
    operation: Function.CancelOperation
    state: ga
    allow_upgrade: true
    reason: "shared google.longrunning.Operations.CancelOperation common API; not enumerated in the service Discovery document, but served (POST /v2/projects/{p}/locations/{l}/operations/{id}:cancel) and wire-tested"
  - service: functions
    operation: Function.DeleteOperation
    state: ga
    allow_upgrade: true
    reason: "shared google.longrunning.Operations.DeleteOperation common API; not enumerated in the service Discovery document, but served (DELETE /v2/projects/{p}/locations/{l}/operations/{id}) and wire-tested"
  - service: functions
    operation: Function.WaitOperation
    state: ga
    allow_upgrade: true
    reason: "google.longrunning.Operations.WaitOperation common API (gRPC-only in the canonical proto — no HTTP annotation); the emulator additionally serves it at POST /v2/projects/{p}/locations/{l}/operations/{id}:wait and wire-tests it"
  # A deployed function's HTTPS-trigger URL is a data-plane endpoint, not a
  # Discovery method: the client addresses it at the synthesized host
  # "{location}-{project}.cloudfunctions.net/{functionId}", so there is no
  # service method to enumerate. The endpoint is served and wire-tested, hence
  # ga.
  - service: functions
    operation: Function.InvokeTrigger
    state: ga
    allow_upgrade: true
    reason: "deployed function's HTTPS-trigger URL (a function URL host, not a Discovery method); served at {location}-{project}.cloudfunctions.net/{functionId} and wire-tested"
  # Cloud Run REST common-API / data-plane methods. The run v2 Discovery document
  # enumerates operations.get/list/delete/wait but not :cancel, and has no
  # `invoke` method at all, so the classifier reports both as limited ("no
  # matching Discovery method"). The handlers are served and wire/unit-tested, so
  # the cells are upgraded to ga.
  - service: run
    operation: Run.CancelOperation
    state: ga
    allow_upgrade: true
    reason: "shared google.longrunning.Operations.CancelOperation common API; not enumerated in the run v2 Discovery document (operations.get/list/delete/wait only), but served (POST /v2/projects/{p}/locations/{l}/operations/{id}:cancel) and wire-tested"
  - service: run
    operation: Run.Invoke
    state: ga
    allow_upgrade: true
    reason: "Cloud Run data-plane invocation (the synthesized {service}-{token}.{location}.run.app host, or the legacy /run/v2/.../services/{svc}/<subpath> path form), not a Discovery method; served by the InvocationCodec/runtime seam and wire/unit-tested (mock resolves 503, the docker/k8s executor proxies to the revision)"
  # Cloud Resource Manager v3 gRPC serves the whole Projects surface — the
  # lifecycle (GetProject / CreateProject / ListProjects / DeleteProject /
  # UndeleteProject), project administration (SearchProjects / UpdateProject /
  # MoveProject) and the project IAM methods — over one core shared with the
  # legacy v1 REST surface. The parent reference (org/folder), mutable metadata
  # (display name, labels) and the search query grammar are modelled, so no
  # overrides are needed.
  # Managed Kafka and Dataproc Metastore Get/ListOperations are `ga`: their own
  # host token (managedkafka.localhost / metastore.localhost, or the canonical
  # *.googleapis.com host) routes the shared locations/{location}/operations
  # family to the owning service, so the handlers are reachable under each
  # service's canonical endpoint (not only by direct dispatch); the default host
  # keeps that path on Cloud Workflows.

  # Dataproc Metastore gRPC is control-plane only: the deferred control-plane
  # RPCs (export/restore/query/move/alter) are gated on a Hive Thrift data plane
  # the emulator does not model per service, so each is an explicit
  # Unimplemented stub.
  - service: metastore
    operation: ExportMetadata
    state: unsupported
    reason: "Hive Thrift metadata export is not modelled; explicit Unimplemented stub"
  - service: metastore
    operation: RestoreService
    state: unsupported
    reason: "Hive Thrift metadata restore is not modelled; explicit Unimplemented stub"
  - service: metastore
    operation: QueryMetadata
    state: unsupported
    reason: "the gRPC metadata query plane is not modelled; explicit Unimplemented stub"
  - service: metastore
    operation: MoveTableToDatabase
    state: unsupported
    reason: "the gRPC metadata mutation plane is not modelled; explicit Unimplemented stub"
  - service: metastore
    operation: AlterMetadataResourceLocation
    state: unsupported
    reason: "the gRPC metadata mutation plane is not modelled; explicit Unimplemented stub"

  # gRPC methods deliberately left limited: each is gated on a subsystem the
  # emulator does not model, so implementing it would fabricate a wire-divergent
  # result. They fail loudly with codes.Unimplemented rather than silently
  # succeeding.
  - service: logging
    operation: TailLogEntries
    state: limited
    reason: "bounded store-poll tail whose latency derives from buffer_window; no deterministic conformance assertion exists"

  # Cloud Logging's Admin v2 config plane — log buckets (+ async), views (with
  # their IAM policy), BigQuery links, log scopes, and the Settings/CMEK
  # records — is implemented on both transports. CopyLogEntries remains an
  # explicit Unimplemented stub: the emulator has no per-bucket entry data
  # plane, so a cross-project copy has nothing faithful to copy.
  - service: logging
    operation: CopyLogEntries
    state: unsupported
    reason: "cross-project log copy is not modelled; explicit Unimplemented stub"

  # AUD2-1 resolved the four REST Logging `limited` cells AUD5 recorded: the
  # `buckets.patch`/`buckets:updateAsync` merges now cover `restrictedFields`
  # and the `sinks.patch`/`sinks.update` merges cover
  # `bigqueryOptions`/`interceptChildren`/`outputVersionFormat`, so every
  # writable field of each resource is merged and the cells are `ga` again. An
  # unmappable mask path is now `400 INVALID_ARGUMENT` (AIP-134), not a 501.
  # (The Discovery probe's `updateMask=labels` selection is the deferred
  # conformance fix, AUD5-2.)

  # BigQuery routines/models/rowAccessPolicies are deliberate 501 stubs (the
  # SQL engine covers datasets/tables/jobs/rows); the rest of the service is
  # graded `limited` by the bigquery default override above.
  - service: bigquery
    operation: BigQuery.Routines
    state: unsupported
    reason: "dataset routines are not modelled; explicit Unimplemented (501) stub"
  - service: bigquery
    operation: BigQuery.Models
    state: unsupported
    reason: "models are not modelled; explicit Unimplemented (501) stub"
  - service: bigquery
    operation: BigQuery.RowAccessPolicies
    state: unsupported
    reason: "row access policies are not modelled; explicit Unimplemented (501) stub"

  # GKE ClusterManager is a metadata control plane (no real Kubernetes control
  # plane; docs/gcp/wire-contract.md §5): cluster CRUD, operations, node-pool CRUD, and the
  # update/setter/rotation RPCs are all served and verified by the official
  # container client. Only the operations that need a real control plane or node
  # lifecycle remain explicit Unimplemented stubs.
  - service: container
    operation: CheckAutopilotCompatibility
    state: unsupported
    reason: "Autopilot is not modelled; explicit Unimplemented stub"
  - service: container
    operation: CompleteControlPlaneUpgrade
    state: unsupported
    reason: "no real control-plane upgrade lifecycle to complete; explicit Unimplemented stub"
  - service: container
    operation: CompleteNodePoolUpgrade
    state: unsupported
    reason: "no real node-pool upgrade lifecycle to complete; explicit Unimplemented stub"
  - service: container
    operation: FetchClusterUpgradeInfo
    state: unsupported
    reason: "no real control-plane upgrade info source; explicit Unimplemented stub"
  - service: container
    operation: FetchNodePoolUpgradeInfo
    state: unsupported
    reason: "no real node-pool upgrade info source; explicit Unimplemented stub"
  - service: container
    operation: GetJSONWebKeys
    state: unsupported
    reason: "cluster signing JWKS are not modelled; explicit Unimplemented stub"
  - service: container
    operation: GetServerConfig
    state: unsupported
    reason: "server config (valid versions/channels) is not modelled; explicit Unimplemented stub"
  - service: container
    operation: ListUsableSubnetworks
    state: unsupported
    reason: "usable-subnetwork discovery requires a Compute subnet catalog; explicit Unimplemented stub"

