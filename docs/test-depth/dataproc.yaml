# Behavioural depth record - dataproc (TD6).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for. The suite targets the
# emulator's mock executor (the CI shape); the real-K8s restart/streaming leg
# stays a local `test-e2e-*` gate (STR3).
service: dataproc
classes:
  p2:
    state: present
    suites: [sdk-dataproc]
    note: "8-way same-jobId submit race (exactly one winner, losers 409) plus parallel distinct submits and concurrent get/cancel churn on one cluster, asserted from a -race test client; every job ends in one terminal state and no listing duplicates a record. That concurrency claim covers the job path only; the GKE cross-API path is a sequential proof, not a contended one: TestSDKDataprocOnGKEPoolReuse shows a second virtual cluster, created after the first completes, naming another one's node pools adopts them instead of duplicating them (asserted through the GKE client, pool count unchanged). No test runs the pool reconciler concurrently."
  p3:
    state: present
    suites: [sdk-dataproc]
    note: "fail-loud unsupported (pigJob/hiveJob/hadoopJob) and malformed sparkJob land on ERROR with a details message, unknown cluster/job 404, duplicate jobId/cluster 409, delete-active-job FAILED_PRECONDITION, both-config-and-virtualClusterConfig 400 and neither 400 (a create must carry exactly one of the two: the SDK suite asserts both 400s over REST and the gRPC conformance check asserts the neither 400; the follow-up read proving the rejected create persists nothing is asserted by the gRPC check and by the REST provider unit test TestCreateCluster_RequiresPlacement, not by a wire transcript), invalid filter/jobStateMatcher/pageSize 400, out-of-range scheduling 400. Dataproc on GKE adds its full create-time rule set as client-visible errors: a nodePool that is not the full resource name, missing/duplicated roles, two pools on one role, a pool zone outside the region, autoscaler bounds, an unknown engine alias, a target in another project, a target that does not exist (404), a target without Workload Identity, an Autopilot target, a patch whose updateMask applies virtualClusterConfig (400 recreate-only), and a kubernetesNamespace already owned on the same GKE cluster (FailedPrecondition) — plus the pool-shape mismatch that lands on ERROR with the pool and field in status.detail (over REST by TestSDKDataprocOnGKEConflictingPoolShape, over gRPC by the vcc pool shape conformance check, which also proves the create LRO completes successfully and returns the ERROR cluster), and the recreate-after-namespace-drop recipe (after the owner is deleted, recreating the same name without kubernetesNamespace settles RUNNING, while a create still naming a namespace a live virtual cluster owns is FailedPrecondition)"
  p4:
    state: present
    suites: [sdk-dataproc]
    note: "listJobs by pageSize/pageToken with cross-page stability composed with clusterName, jobStateMatcher and the labels/status.state filter grammar (filter overrides the matcher), and listClusters paging composed with the status.state/clusterName/labels filters"
  p5:
    state: present
    suites: [sdk-dataproc]
    note: "a streaming pysparkJob stays RUNNING across repeated reads until cancelled, a submitAsOperation LRO tracks the non-terminal job and closes on cancellation with the CANCELLED job as its response, scheduling counters round-trip, and a 12-job listing walks every page. For Dataproc on GKE: a two-target virtual cluster round-trips and its pools carry the Dataproc auto labels (asserted through the GKE API), a service-created pool gets the 1/10 autoscaler defaults, the pools survive the virtual-cluster delete, and a pysparkJob on a reconciled virtual cluster still reaches DONE (placement is not observable through either API and is not asserted). A three-target shape appears only in the recorded REST conformance transcript — nothing asserts it"
