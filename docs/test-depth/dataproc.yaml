# Behavioural depth record - dataproc (TD6).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for. The suite targets the
# emulator's mock executor (the CI shape); the real-K8s restart/streaming leg
# stays a local `test-e2e-*` gate (STR3).
service: dataproc
classes:
  p2:
    state: present
    suites: [sdk-dataproc]
    note: "8-way same-jobId submit race (exactly one winner, losers 409) plus parallel distinct submits and concurrent get/cancel churn on one cluster, asserted from a -race test client; every job ends in one terminal state and no listing duplicates a record. The GKE cross-API path is also concurrent-safe: a second virtual cluster naming another one's node pools adopts them instead of duplicating them (asserted through the GKE client, pool count unchanged)"
  p3:
    state: present
    suites: [sdk-dataproc]
    note: "fail-loud unsupported (pigJob/hiveJob/hadoopJob) and malformed sparkJob land on ERROR with a details message, unknown cluster/job 404, duplicate jobId/cluster 409, delete-active-job FAILED_PRECONDITION, both-config-and-virtualClusterConfig 400 and neither 400 (a create must carry exactly one, and the rejected create persists nothing — asserted over gRPC and REST), invalid filter/jobStateMatcher/pageSize 400, out-of-range scheduling 400. Dataproc on GKE adds its full create-time rule set as client-visible errors: a nodePool that is not the full resource name, missing/duplicated roles, two pools on one role, a pool zone outside the region, autoscaler bounds, an unknown engine alias, a target in another project, a target that does not exist (404), a target without Workload Identity, an Autopilot target, a patch touching virtualClusterConfig (400 recreate-only), and a kubernetesNamespace already owned on the same GKE cluster (FailedPrecondition) — plus the pool-shape mismatch that lands on ERROR with the pool and field in status.detail"
  p4:
    state: present
    suites: [sdk-dataproc]
    note: "listJobs by pageSize/pageToken with cross-page stability composed with clusterName, jobStateMatcher and the labels/status.state filter grammar (filter overrides the matcher), and listClusters paging composed with the status.state/clusterName/labels filters"
  p5:
    state: present
    suites: [sdk-dataproc]
    note: "a streaming pysparkJob stays RUNNING across repeated reads until cancelled, a submitAsOperation LRO tracks the non-terminal job and closes on cancellation with the CANCELLED job as its response, scheduling counters round-trip, and a 12-job listing walks every page. For Dataproc on GKE: two and three node-pool targets round-trip through the GKE API with the Dataproc auto labels, a service-created pool gets the 1/10 autoscaler defaults, the pools survive the virtual-cluster delete, and a pysparkJob on a reconciled virtual cluster still reaches DONE (placement is not observable through either API and is not asserted)"
