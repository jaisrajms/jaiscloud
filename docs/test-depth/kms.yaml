# Behavioural depth record - kms (TD1).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: kms
classes:
  p2:
    state: present
    suites: [sdk-rest]
    note: "concurrent crypto-key-version create allocates distinct version numbers (no lost update), destroy is idempotent (every caller settles DESTROY_SCHEDULED), and updatePrimaryVersion is atomic"
  p3:
    state: present
    suites: [sdk-rest]
    note: "key-version destroy / not-found envelopes"
  p4:
    state: present
    suites: [sdk-rest]
    note: "pageSize/pageToken paging over key rings, a key's crypto-key versions and a key ring's import jobs, composed with the documented name/name desc orderBy and the name/labels/state/importMethod/protectionLevel filter (DC14, DC23)"
  p5:
    state: present
    suites: [sdk-rest]
    note: "key-version rotation and scheduled-destroy lineage"
