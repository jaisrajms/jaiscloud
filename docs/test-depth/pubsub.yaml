# Behavioural depth record - pubsub (TD1).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: pubsub
classes:
  p2:
    state: present
    suites: [sdk-pubsub]
    note: "exactly-once ack IDs, ack-deadline redelivery, ordering-key contention"
  p3:
    state: present
    suites: [sdk-rest]
    note: "delete-of-missing 404 and dead-letter envelopes"
  p4:
    state: present
    suites: [sdk-pubsub]
    note: "pageSize/pageToken walk over projects.topics.list and projects.subscriptions.list (every resource once, no page larger than requested, terminal token, stable second walk); the Discovery document specifies no order and no filter, so each is compared as a set"
  p5:
    state: present
    suites: [sdk-pubsub]
    note: "retention + snapshot/seek, streaming pull, DLQ fan-out"
