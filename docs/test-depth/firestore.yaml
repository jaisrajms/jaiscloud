# Behavioural depth record - firestore (TD1).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: firestore
classes:
  p2:
    state: present
    suites: [sdk-firestore]
    note: "transaction read-conflict abort and update-time precondition"
  p3:
    state: present
    suites: [sdk-firestore]
    note: "delete-precondition failure, write limits, composite-index rejection"
  p4:
    state: present
    suites: [sdk-firestore]
    note: "cursor paging and get-after-update-missing"
  p5:
    state: present
    suites: [sdk-firestore]
    note: "batch write-limit boundary and multi-document commit"
