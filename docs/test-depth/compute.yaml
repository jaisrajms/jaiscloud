# Behavioural depth record - compute (TD4).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: compute
classes:
  p2:
    state: present
    suites: [sdk-compute]
    note: "same-name insert/delete races (exactly one winner, losers 409/404) plus distinct-name churn, asserted from a -race test client"
  p3:
    state: present
    suites: [sdk-compute]
    note: "invalid name/machine-type rejected 400, get-after-delete 404, duplicate insert 409, requestId idempotency (a token retry replays the original operation and echoes clientOperationId; a malformed/zero token is 400)"
  p4:
    state: present
    suites: [sdk-compute]
    note: "maxResults/pageToken walks of the zonal and aggregated listings, composed with the filter subset"
  p5:
    state: present
    suites: [sdk-compute]
    note: "zonal and global operation polling lifecycle plus a many-resource aggregated listing"
