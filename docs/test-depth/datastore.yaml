# Behavioural depth record - datastore (TD1).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: datastore
classes:
  p2:
    state: present
    suites: [sdk-datastore]
    note: "transaction conflict aborts (no lost update)"
  p3:
    state: present
    suites: [sdk-datastore]
    note: "the generated client's typed error envelope on the documented negatives: an incomplete lookup key and a negative query offset are INVALID_ARGUMENT, an insert on an existing key is ALREADY_EXISTS, an update of a missing entity is NOT_FOUND (both commit paths; DC18), and a read-write transaction whose read-set was modified concurrently is ABORTED"
  p4:
    state: present
    suites: [sdk-datastore]
    note: "cursor paging (Limit + MORE_RESULTS_AFTER_LIMIT + resume)"
  p5:
    state: present
    suites: [sdk-datastore]
    note: "batch GetMulti/PutMulti multi-entity boundary"
