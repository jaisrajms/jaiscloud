# Behavioural depth record - firestoreadmin (TD1).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
#
# The suite (tests/integration/gcp/sdk-firestoreadmin) is the service's first
# official-client suite: it drives the google.firestore.admin.v1.FirestoreAdmin
# gRPC client through the admin control plane (databases, composite indexes,
# collection-group fields, backup schedules, user creds, read-only backups).
service: firestoreadmin
classes:
  p2:
    state: present
    suites: [sdk-firestoreadmin]
    note: "concurrent control-plane mutations under -race: a same-name database create and a same-id user-creds create each have exactly one winner (losers ALREADY_EXISTS), distinct creates all land, and a user-creds delete is not idempotent (one winner, losers NOT_FOUND)"
  p3:
    state: present
    suites: [sdk-firestoreadmin]
    note: "the official client's typed envelope on the documented negatives: an invalid database id and a single-field composite index are INVALID_ARGUMENT, a masked change to the immutable database_edition is INVALID_ARGUMENT (while the OUTPUT_ONLY version_retention_period/key_prefix in a patch are ignored and the retention window is derived from the PITR toggle), creating the implicit (default) database or a duplicate database/user-creds is ALREADY_EXISTS, a stale-etag database delete is FAILED_PRECONDITION (the documented blocked deletion, distinct from an update's ABORTED) leaving the database in place, a stale-etag delete of the materialized implicit (default) database is FAILED_PRECONDITION for the same reason, a delete of a database with delete protection enabled is FAILED_PRECONDITION and leaves it in place, and a missing database/index/user-creds/backup is NOT_FOUND on get/delete"
  p4:
    state: present
    suites: [sdk-firestoreadmin]
    note: "pageSize/pageToken paging over projects.databases.collectionGroups.indexes.list — among the admin resources this suite drives, the composite-index list is the one the Discovery document paginates (databases.list and backups.list declare no cursor and are asserted as complete responses); the document specifies no order, so the walk is compared as a set"
  p5:
    state: present
    suites: [sdk-firestoreadmin]
    note: "the scale/boundary class: a twenty-five-index collection group walked at page size 4 (the whole cursor chain), and a twenty-five-user-creds database returned whole by the unpaged ListUserCreds"
