# Behavioural depth record - iam (TD1).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: iam
classes:
  p2:
    state: exempt
    reason: "authorization is not enforced (shape-only by design, docs/gcp/testability.md §5/§7), so no permission-gated contention contract can be asserted; the one cross-writer arbiter on a service account is the shared store's create primitive, which resourcemanager p2 asserts directly, so an iam-local restatement would add no new observable contract"
    date: "2026-10-16"
    owner: DC3
    review_by: "2027-04-16"
  p3:
    state: present
    suites: [sdk-rest]
    note: "invalid-create / not-found service-account envelopes, including the documented wildcard distinction: a miss through `projects/-` (the form every `gcloud iam service-accounts` command addresses) is 403 PERMISSION_DENIED while the concrete project path stays 404 NOT_FOUND"
  p4:
    state: present
    suites: [sdk-rest]
    note: "pageSize/pageToken walk over projects.serviceAccounts.list (every account once, terminal token, stable second walk; the Discovery document specifies no order, so it is compared as a set); keys.list is unpaged by Discovery (no pageToken, no nextPageToken) and is asserted as a single complete response whose repeated keyTypes filter selects USER_MANAGED, SYSTEM_MANAGED or their union, with KEY_TYPE_UNSPECIFIED and duplicate values rejected as INVALID_ARGUMENT"
  p5:
    state: exempt
    reason: "no enforced boundary and no version/rotation lineage: the documented 10-user-managed-keys-per-SA quota is not modelled, and a service account carries no update history to walk"
    date: "2026-10-16"
    owner: DC3
    review_by: "2027-04-16"
