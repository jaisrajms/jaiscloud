# Behavioural depth record - storage (TD1, p2/p5 extended by TD10 for gRPC).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: storage
classes:
  p2:
    state: present
    suites: [sdk, sdk-gcs-grpc]
    note: "REST: object preconditions (etag / if-generation -> 412) and versioned generation lineage. gRPC (depth_test.go, under -race): parallel writer streams to distinct objects all land, parallel reader streams return the exact bytes, and eight writers racing DoesNotExist (or one generation) on a single object leave exactly one winner — the losers FAILED_PRECONDITION — and the object moves to a new generation, so no write is silently lost"
  p3:
    state: present
    suites: [sdk]
    note: "delete-of-missing 404 plus bucket/object error envelopes"
  p4:
    state: present
    suites: [sdk]
    note: "list composed with prefix + delimiter + pageToken"
  p5:
    state: present
    suites: [sdk, sdk-gcs-grpc]
    note: "REST: resumable large-object stream and retention-blocks-delete. gRPC: a 32 MiB object written in 8 MiB chunks and read back through the gRPC read surface with a running content hash (never holding a second full copy), a mid-object range read that returns exactly its slice, and a many-object listing"
