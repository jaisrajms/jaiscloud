# Behavioural depth record - functions (TD1).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: functions
classes:
  p2:
    state: present
    suites: [sdk-rest]
    note: "concurrent control-plane mutations under -race: a same-name create has one winner (losers ALREADY_EXISTS/409), distinct creates each land, a delete is not idempotent (one winner, losers NOT_FOUND/404), and distinct deletes each land"
  p3:
    state: present
    suites: [sdk-rest]
    note: "the official client's typed error envelope on the documented negatives: a create with no runtime is INVALID_ARGUMENT, a get/delete of a missing function is NOT_FOUND, and a duplicate name is ALREADY_EXISTS; a source-archive reference to a missing GCS object is also NOT_FOUND — the emulator's synchronous deploy-time resolution (real GCP resolves the source asynchronously and reports the failure through the operation)"
  p4:
    state: present
    suites: [sdk-rest]
    note: "pageSize/pageToken paging over projects.locations.functions.list scoped by location (a walk of one location cannot leak another's functions; the locations/- wildcard aggregates them); the Discovery document declares no list filter and no default order, so the walk is compared as a set (RequireNonEmptyPages pins the emulator's page filling; the coerced negative pageSize is DC12)"
  p5:
    state: present
    suites: [sdk-rest]
    note: "the revision-lineage boundary: each generateUploadUrl upload + patch of buildConfig.source deploys a new archive and advances the backing Cloud Run revision counter (serviceConfig.revision = {id}-{NNNNN}-{sha8}) monotonically over repeated redeploys"
