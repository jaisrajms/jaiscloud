# Behavioural depth record - monitoring (TD1).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: monitoring
classes:
  p2:
    state: present
    suites: [sdk-monitoring]
    note: "concurrent metric-descriptor and time-series writes under -race"
  p3:
    state: present
    suites: [sdk-monitoring]
    note: "typed gRPC status for not-found and invalid-input negatives"
  p4:
    state: present
    suites: [sdk-monitoring]
    note: "ListTimeSeries with Interval + iterator"
  p5:
    state: present
    suites: [sdk-monitoring]
    note: "100-series CreateTimeSeries batch fully retained"
