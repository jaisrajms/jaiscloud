# Behavioural depth record - resourcemanager (TD1).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: resourcemanager
classes:
  p2:
    state: present
    suites: [sdk-rest]
    note: "concurrent same-id projects.create race (the store's atomic upsert picks one winner, every loser is AlreadyExists) and idempotent concurrent delete (all succeed, the project settles DELETE_REQUESTED), under -race"
  p3:
    state: present
    suites: [sdk-rest]
    note: "invalid project create rejected"
  p4:
    state: present
    suites: [sdk-rest]
    note: "pageSize/pageToken walk over projects.list composed with a labels filter, so the cursor walks the filtered set and never leaks an unlabelled project; order is compared as a set because the Discovery document states projects.list returns an unspecified order (and is only eventually consistent in real GCP, while the emulator is strongly consistent)"
  p5:
    state: present
    suites: [sdk-rest]
    note: "a 25-project boundary walked with a small page size, asserting the cursor chain spans the whole collection"
