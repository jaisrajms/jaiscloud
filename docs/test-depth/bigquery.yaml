# Behavioural depth record - bigquery (TD5).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for. `bigquery` is a
# `limited` service (a documented Standard SQL subset), so these classes cover
# its control plane, the executed-SQL result surface and gs:// load boundary.
service: bigquery
classes:
  p2:
    state: present
    suites: [sdk-bigquery]
    note: "8-way duplicate-dataset create race (exactly one winner, losers 409), parallel table create/get/update churn, and concurrent WRITE_APPEND gs:// load jobs against one destination table, asserted from a -race test client"
  p3:
    state: present
    suites: [sdk-bigquery]
    note: "duplicate dataset/table 409, unknown dataset/table/job 404, subset rejection (legacy SQL/UNNEST/wildcard table/SAFE.) 400, jobs.insert without jobId 400, negative maxResults 400 on every list/read method"
  p4:
    state: present
    suites: [sdk-bigquery]
    note: "datasets/tables/jobs listing by maxResults+pageToken (cross-page stability), tabledata.list by maxResults+startIndex, and jobs.query/getQueryResults result-set paging (pageToken + startIndex)"
  p5:
    state: present
    suites: [sdk-bigquery]
    note: "gs:// load boundary - multi-object wildcard source, gzip NEWLINE_DELIMITED_JSON with an autodetected FLOAT schema, a 2000-row load, and a bounded large-result query (totalRows + all rows)"
