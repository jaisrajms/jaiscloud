# Behavioural depth record - secretmanager (TD1).
#
# p2-p5 are defined in docs/gcp/testability.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned, dated and owned, with a future `review_by`). `make
# gcp-status-depth-gate` fails when a `ga` service has no record here or leaves a
# class unaccounted for.
service: secretmanager
classes:
  p2:
    state: present
    suites: [sdk-rest]
    note: "concurrent version add allocates distinct version numbers (no lost update) and concurrent disable is idempotent; the documented etag precondition (secrets.delete + version disable/enable/destroy, ABORTED on mismatch) is enforced (DC13)"
  p3:
    state: present
    suites: [sdk-rest]
    note: "delete-of-missing 404 and IAM error envelopes"
  p4:
    state: present
    suites: [sdk-rest]
    note: "pageSize/pageToken paging over secrets and a secret's versions, composed with the documented filter (DC14)"
  p5:
    state: present
    suites: [sdk-rest]
    note: "version rotation and scheduled-destroy retention; the background sweep publishes SECRET_ROTATE / SECRET_DELETE(EXPIRATION) / SECRET_VERSION_DESTROY with no client read, and every access gate enforces the exact expireTime/scheduledDestroyTime boundary before a tick runs"
