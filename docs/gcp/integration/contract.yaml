# GENERATED by "make gen-integration-contract" — do not edit by hand.
# Facts come from the manifests listed under metadata.sources; the playbook
# comes from docs/gcp/integration/playbook.yaml.
apiVersion: jaiscloud.dev/integration/v1
kind: IntegrationContract
metadata:
  generator: tools/integrationcontract
  sources:
    - deploy/k8s/namespace-aws.yaml
    - deploy/k8s/namespace-gcp.yaml
    - deploy/k8s/namespace-data.yaml
    - deploy/k8s/postgres.yaml
    - deploy/k8s/rbac-shared.yaml
    - deploy/k8s/rbac-aws.yaml
    - deploy/k8s/rbac-gcp.yaml
    - deploy/k8s/rbac-admission-policy.yaml
    - deploy/k8s/jaiscloud.yaml
    - deploy/k8s/jaiscloud-gcp.yaml
  notes: Images, ports, env and claims are the manifest defaults. Secret values are deliberately omitted (key names only). Run make check-integration-contract after changing a manifest.
topology:
  namespaces:
    - name: jaiscloud
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: substrate
        jaiscloud.io/substrate: aws
      role: substrate
      substrate: aws
    - name: jaiscloud-data
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: data
      role: data
    - name: jaiscloud-gcp
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: substrate
        jaiscloud.io/substrate: gcp
      role: substrate
      substrate: gcp
  objects:
    - kind: ClusterRole
      name: jaiscloud-executor
    - kind: ClusterRole
      name: jaiscloud-namespace-admin
    - kind: ClusterRoleBinding
      name: jaiscloud-namespace-admin-aws
      roleRef:
        kind: ClusterRole
        name: jaiscloud-namespace-admin
      subjects:
        - kind: ServiceAccount
          name: jaiscloud
          namespace: jaiscloud
    - kind: ClusterRoleBinding
      name: jaiscloud-namespace-admin-gcp
      roleRef:
        kind: ClusterRole
        name: jaiscloud-namespace-admin
      subjects:
        - kind: ServiceAccount
          name: jaiscloud-gcp
          namespace: jaiscloud-gcp
    - kind: Namespace
      name: jaiscloud
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: substrate
        jaiscloud.io/substrate: aws
    - kind: Namespace
      name: jaiscloud-data
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: data
    - kind: Namespace
      name: jaiscloud-gcp
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: substrate
        jaiscloud.io/substrate: gcp
    - kind: ValidatingAdmissionPolicy
      name: jaiscloud-namespace-isolation
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/component: isolation
    - kind: ValidatingAdmissionPolicyBinding
      name: jaiscloud-namespace-isolation
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/component: isolation
    - kind: ConfigMap
      name: jaiscloud-config
      namespace: jaiscloud
      data:
        JAISCLOUD_ACCOUNT_ID: "000000000000"
        JAISCLOUD_BLOB_DIR: /data/blobs
        JAISCLOUD_EXECUTOR_MODE: k8s
        JAISCLOUD_INSTANCE_ID: aws-substrate-1
        JAISCLOUD_K8S_APISERVER: https://kubernetes.default.svc
        JAISCLOUD_K8S_CA_FILE: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        JAISCLOUD_K8S_NAMESPACE: jaiscloud
        JAISCLOUD_K8S_SA: jaiscloud
        JAISCLOUD_K8S_SPARK_IMAGE: apache/spark:3.5.0
        JAISCLOUD_K8S_TOKEN_FILE: /var/run/secrets/kubernetes.io/serviceaccount/token
        JAISCLOUD_LAMBDA_IMAGE: public.ecr.aws/lambda/python:3.12
        JAISCLOUD_LOG_LEVEL: info
        JAISCLOUD_METRICS: "true"
        JAISCLOUD_MODE: full
        JAISCLOUD_PORT: "4566"
        JAISCLOUD_REGION: us-east-1
        JAISCLOUD_STATE_DIR: /data/state
    - kind: Deployment
      name: jaiscloud
      namespace: jaiscloud
      replicas: 1
      strategy: Recreate
      serviceAccount: jaiscloud
      containers:
        - name: jaiscloud
          image: jaisraj/jaiscloud-aws:latest
          imagePullPolicy: IfNotPresent
          ports:
            - port: 4566
          env:
            - name: JAISCLOUD_DSN
              from: secret:jaiscloud-dsn/dsn
          envFrom:
            - configMap:jaiscloud-config
      claims:
        - jaiscloud-blobs-pvc
        - jaiscloud-state-pvc
    - kind: PersistentVolumeClaim
      name: jaiscloud-blobs-pvc
      namespace: jaiscloud
      accessModes:
        - ReadWriteOnce
      storage: 5Gi
    - kind: PersistentVolumeClaim
      name: jaiscloud-state-pvc
      namespace: jaiscloud
      accessModes:
        - ReadWriteOnce
      storage: 64Mi
    - kind: Role
      name: jaiscloud-executor
      namespace: jaiscloud
    - kind: RoleBinding
      name: jaiscloud-executor
      namespace: jaiscloud
      roleRef:
        kind: Role
        name: jaiscloud-executor
      subjects:
        - kind: ServiceAccount
          name: jaiscloud
          namespace: jaiscloud
    - kind: Secret
      name: jaiscloud-dsn
      namespace: jaiscloud
      type: Opaque
      keys:
        - dsn
    - kind: Service
      name: jaiscloud
      namespace: jaiscloud
      type: LoadBalancer
      ports:
        - port: 4566
          targetPort: "4566"
    - kind: ServiceAccount
      name: jaiscloud
      namespace: jaiscloud
      automountServiceAccountToken: true
    - kind: Deployment
      name: postgres
      namespace: jaiscloud-data
      labels:
        app: postgres
        jaiscloud.io/managed-by: jaiscloud
      replicas: 1
      strategy: Recreate
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - port: 5432
          envFrom:
            - secret:postgres-secret
      claims:
        - postgres-pvc
    - kind: PersistentVolumeClaim
      name: postgres-pvc
      namespace: jaiscloud-data
      labels:
        app: postgres
        jaiscloud.io/managed-by: jaiscloud
      accessModes:
        - ReadWriteOnce
      storage: 1Gi
    - kind: Secret
      name: postgres-secret
      namespace: jaiscloud-data
      labels:
        app: postgres
        jaiscloud.io/managed-by: jaiscloud
      type: Opaque
      keys:
        - POSTGRES_DB
        - POSTGRES_PASSWORD
        - POSTGRES_USER
        - dsn
    - kind: Service
      name: postgres
      namespace: jaiscloud-data
      labels:
        app: postgres
        jaiscloud.io/managed-by: jaiscloud
      ports:
        - port: 5432
          targetPort: "5432"
    - kind: Service
      name: postgres-external
      namespace: jaiscloud-data
      labels:
        app: postgres
        jaiscloud.io/managed-by: jaiscloud
      type: NodePort
      ports:
        - port: 5432
          targetPort: "5432"
          nodePort: 30543
    - kind: Deployment
      name: jaiscloud-gcp
      namespace: jaiscloud-gcp
      labels:
        app: jaiscloud-gcp
      replicas: 1
      strategy: Recreate
      serviceAccount: jaiscloud-gcp
      containers:
        - name: jaiscloud-gcp
          image: jaisraj/jaiscloud-gcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              port: 8080
            - name: grpc
              port: 8081
            - name: hms
              port: 9083
            - name: hms-catalog-0
              port: 9084
            - name: hms-catalog-1
              port: 9085
            - name: hms-catalog-2
              port: 9086
            - name: hms-catalog-3
              port: 9087
            - name: hms-catalog-4
              port: 9088
            - name: hms-catalog-5
              port: 9089
            - name: hms-catalog-6
              port: 9090
            - name: hms-catalog-7
              port: 9091
            - name: hms-catalog-8
              port: 9092
            - name: hms-catalog-9
              port: 9093
          env:
            - name: JAISCLOUD_DSN
              from: secret:jaiscloud-gcp-dsn/dsn
            - name: JAISCLOUD_K8S_NAMESPACE
              value: jaiscloud-gcp
            - name: JAISCLOUD_K8S_SA
              value: jaiscloud-gcp
            - name: JAISCLOUD_K8S_SA_NAMESPACE
              value: jaiscloud-gcp
            - name: JAISCLOUD_INSTANCE_ID
              value: gcp-substrate-1
            - name: JAISCLOUD_STATE_DIR
              value: /data/state
            - name: JAISCLOUD_SPARK_EXECUTOR_MODE
              value: k8s
            - name: JAISCLOUD_K8S_SPARK_IMAGE
              value: apache/spark:3.5.0
            - name: JAISCLOUD_K8S_SPARK_SUBMIT_PATH
              value: /opt/spark/bin/spark-submit
            - name: JAISCLOUD_GCS_EMULATOR_ENDPOINT
              value: http://jaiscloud-gcp.jaiscloud-gcp.svc.cluster.local:8080
            - name: JAISCLOUD_DATAPROC_HMS_ENDPOINT
              value: jaiscloud-gcp.jaiscloud-gcp.svc.cluster.local:9083
            - name: JAISCLOUD_PLATFORM_TLS_ENABLED
              value: "false"
            - name: JAISCLOUD_KAFKA_BROKER_MODE
              value: k8s
            - name: JAISCLOUD_CLOUDRUN_EXECUTOR_MODE
              value: k8s
      claims:
        - jaiscloud-gcp-blobs-pvc
        - jaiscloud-gcp-state-pvc
    - kind: PersistentVolumeClaim
      name: jaiscloud-gcp-blobs-pvc
      namespace: jaiscloud-gcp
      accessModes:
        - ReadWriteOnce
      storage: 5Gi
    - kind: PersistentVolumeClaim
      name: jaiscloud-gcp-state-pvc
      namespace: jaiscloud-gcp
      accessModes:
        - ReadWriteOnce
      storage: 64Mi
    - kind: RoleBinding
      name: jaiscloud-executor
      namespace: jaiscloud-gcp
      roleRef:
        kind: ClusterRole
        name: jaiscloud-executor
      subjects:
