# GENERATED by "make gen-integration-contract" — do not edit by hand.
# Facts come from the manifests listed under metadata.sources; the playbook
# comes from docs/gcp/integration/playbook.yaml.
apiVersion: jaiscloud.dev/integration/v1
kind: IntegrationContract
metadata:
  generator: tools/integrationcontract
  sources:
    - deploy/k8s/namespace.yaml
    - deploy/k8s/postgres.yaml
    - deploy/k8s/rbac.yaml
    - deploy/k8s/rbac-admission-policy.yaml
    - deploy/k8s/jaiscloud.yaml
    - deploy/k8s/jaiscloud-gcp.yaml
  notes: Images, ports, env and claims are the manifest defaults. Secret values are deliberately omitted (key names only). Run make check-integration-contract after changing a manifest.
topology:
  namespaces:
    - name: jaiscloud
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: substrate
        jaiscloud.io/substrate: aws
      role: substrate
      substrate: aws
    - name: jaiscloud-data
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: data
      role: data
    - name: jaiscloud-gcp
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: substrate
        jaiscloud.io/substrate: gcp
      role: substrate
      substrate: gcp
  objects:
    - kind: ClusterRole
      name: jaiscloud-executor
    - kind: ClusterRole
      name: jaiscloud-namespace-admin
    - kind: ClusterRoleBinding
      name: jaiscloud-namespace-admin
      roleRef:
        kind: ClusterRole
        name: jaiscloud-namespace-admin
      subjects:
        - kind: ServiceAccount
          name: jaiscloud
          namespace: jaiscloud
        - kind: ServiceAccount
          name: jaiscloud-gcp
          namespace: jaiscloud-gcp
    - kind: Namespace
      name: jaiscloud
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: substrate
        jaiscloud.io/substrate: aws
    - kind: Namespace
      name: jaiscloud-data
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: data
    - kind: Namespace
      name: jaiscloud-gcp
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/role: substrate
        jaiscloud.io/substrate: gcp
    - kind: ValidatingAdmissionPolicy
      name: jaiscloud-namespace-isolation
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/component: isolation
    - kind: ValidatingAdmissionPolicyBinding
      name: jaiscloud-namespace-isolation
      labels:
        app.kubernetes.io/part-of: jaiscloud
        jaiscloud.io/component: isolation
    - kind: ConfigMap
      name: jaiscloud-config
      namespace: jaiscloud
      data:
        JAISCLOUD_ACCOUNT_ID: "000000000000"
        JAISCLOUD_BLOB_DIR: /data/blobs
        JAISCLOUD_EXECUTOR_MODE: k8s
        JAISCLOUD_INSTANCE_ID: aws-substrate-1
        JAISCLOUD_K8S_APISERVER: https://kubernetes.default.svc
        JAISCLOUD_K8S_CA_FILE: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        JAISCLOUD_K8S_NAMESPACE: jaiscloud
        JAISCLOUD_K8S_SA: jaiscloud
        JAISCLOUD_K8S_SPARK_IMAGE: apache/spark:3.5.0
        JAISCLOUD_K8S_TOKEN_FILE: /var/run/secrets/kubernetes.io/serviceaccount/token
        JAISCLOUD_LAMBDA_IMAGE: public.ecr.aws/lambda/python:3.12
        JAISCLOUD_LOG_LEVEL: info
        JAISCLOUD_METRICS: "true"
        JAISCLOUD_MODE: full
        JAISCLOUD_PORT: "4566"
        JAISCLOUD_REGION: us-east-1
        JAISCLOUD_STATE_DIR: /data/state
    - kind: Deployment
      name: jaiscloud
      namespace: jaiscloud
      replicas: 1
      strategy: Recreate
      serviceAccount: jaiscloud
      containers:
        - name: jaiscloud
          image: jaisraj/jaiscloud-aws:latest
          imagePullPolicy: IfNotPresent
          ports:
            - port: 4566
          env:
            - name: JAISCLOUD_DSN
              from: secret:jaiscloud-dsn/dsn
          envFrom:
            - configMap:jaiscloud-config
      claims:
        - jaiscloud-blobs-pvc
        - jaiscloud-state-pvc
    - kind: PersistentVolumeClaim
      name: jaiscloud-blobs-pvc
      namespace: jaiscloud
      accessModes:
        - ReadWriteOnce
      storage: 5Gi
    - kind: PersistentVolumeClaim
      name: jaiscloud-state-pvc
      namespace: jaiscloud
      accessModes:
        - ReadWriteOnce
      storage: 64Mi
    - kind: Role
      name: jaiscloud-executor
      namespace: jaiscloud
    - kind: RoleBinding
      name: jaiscloud-executor
      namespace: jaiscloud
      roleRef:
        kind: Role
        name: jaiscloud-executor
      subjects:
        - kind: ServiceAccount
          name: jaiscloud
          namespace: jaiscloud
    - kind: Secret
      name: jaiscloud-dsn
      namespace: jaiscloud
      type: Opaque
      keys:
        - dsn
    - kind: Service
      name: jaiscloud
      namespace: jaiscloud
      type: LoadBalancer
      ports:
        - port: 4566
          targetPort: "4566"
    - kind: ServiceAccount
      name: jaiscloud
      namespace: jaiscloud
      automountServiceAccountToken: true
    - kind: ConfigMap
      name: postgres-init
      namespace: jaiscloud-data
      data:
        01-gcp-db.sql: |
          -- GCP substrate database (the GCP DSN secret points at this one).
          CREATE DATABASE jaiscloud_gcp;
    - kind: Deployment
      name: postgres
      namespace: jaiscloud-data
      replicas: 1
      strategy: Recreate
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - port: 5432
          envFrom:
            - secret:postgres-secret
      claims:
        - postgres-pvc
    - kind: PersistentVolumeClaim
      name: postgres-pvc
      namespace: jaiscloud-data
      accessModes:
        - ReadWriteOnce
      storage: 1Gi
    - kind: Secret
      name: postgres-secret
      namespace: jaiscloud-data
      type: Opaque
      keys:
        - POSTGRES_DB
        - POSTGRES_PASSWORD
        - POSTGRES_USER
        - dsn
    - kind: Service
      name: postgres
      namespace: jaiscloud-data
      ports:
        - port: 5432
          targetPort: "5432"
    - kind: Service
      name: postgres-external
      namespace: jaiscloud-data
      type: NodePort
      ports:
        - port: 5432
          targetPort: "5432"
          nodePort: 30543
    - kind: Deployment
      name: jaiscloud-gcp
      namespace: jaiscloud-gcp
      labels:
        app: jaiscloud-gcp
      replicas: 1
      strategy: Recreate
      serviceAccount: jaiscloud-gcp
      containers:
        - name: jaiscloud-gcp
          image: jaisraj/jaiscloud-gcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              port: 8080
            - name: grpc
              port: 8081
            - name: hms
              port: 9083
            - name: hms-catalog-0
              port: 9084
            - name: hms-catalog-1
              port: 9085
            - name: hms-catalog-2
              port: 9086
            - name: hms-catalog-3
              port: 9087
            - name: hms-catalog-4
              port: 9088
            - name: hms-catalog-5
              port: 9089
            - name: hms-catalog-6
              port: 9090
            - name: hms-catalog-7
              port: 9091
            - name: hms-catalog-8
              port: 9092
            - name: hms-catalog-9
              port: 9093
          env:
            - name: JAISCLOUD_DSN
              from: secret:jaiscloud-gcp-dsn/dsn
            - name: JAISCLOUD_K8S_NAMESPACE
              value: jaiscloud-gcp
            - name: JAISCLOUD_K8S_SA
              value: jaiscloud-gcp
            - name: JAISCLOUD_K8S_SA_NAMESPACE
              value: jaiscloud-gcp
            - name: JAISCLOUD_INSTANCE_ID
              value: gcp-substrate-1
            - name: JAISCLOUD_STATE_DIR
              value: /data/state
            - name: JAISCLOUD_SPARK_EXECUTOR_MODE
              value: k8s
            - name: JAISCLOUD_K8S_SPARK_IMAGE
              value: 10.0.100.21:5050/spark-gcs:3.5.0
            - name: JAISCLOUD_K8S_SPARK_SUBMIT_PATH
              value: /opt/spark/bin/spark-submit
            - name: JAISCLOUD_GCS_EMULATOR_ENDPOINT
              value: http://jaiscloud-gcp.jaiscloud-gcp.svc.cluster.local:8080
            - name: JAISCLOUD_DATAPROC_HMS_ENDPOINT
              value: jaiscloud-gcp.jaiscloud-gcp.svc.cluster.local:9083
            - name: JAISCLOUD_PLATFORM_TLS_ENABLED
              value: "false"
            - name: JAISCLOUD_KAFKA_BROKER_MODE
              value: k8s
            - name: JAISCLOUD_CLOUDRUN_EXECUTOR_MODE
              value: k8s
      claims:
        - jaiscloud-gcp-blobs-pvc
        - jaiscloud-gcp-state-pvc
    - kind: PersistentVolumeClaim
      name: jaiscloud-gcp-blobs-pvc
      namespace: jaiscloud-gcp
      accessModes:
        - ReadWriteOnce
      storage: 5Gi
    - kind: PersistentVolumeClaim
      name: jaiscloud-gcp-state-pvc
      namespace: jaiscloud-gcp
      accessModes:
        - ReadWriteOnce
      storage: 64Mi
    - kind: RoleBinding
      name: jaiscloud-executor
      namespace: jaiscloud-gcp
      roleRef:
        kind: ClusterRole
        name: jaiscloud-executor
      subjects:
        - kind: ServiceAccount
          name: jaiscloud-gcp
          namespace: jaiscloud-gcp
    - kind: Secret
      name: jaiscloud-gcp-dsn
      namespace: jaiscloud-gcp
      type: Opaque
      keys:
        - dsn
    - kind: Service
      name: jaiscloud-gcp
      namespace: jaiscloud-gcp
      labels:
        app: jaiscloud-gcp
      type: ClusterIP
      ports:
        - name: rest
          port: 8080
          targetPort: "8080"
        - name: grpc
          port: 8081
          targetPort: "8081"
        - name: hms
          port: 9083
          targetPort: "9083"
        - name: hms-catalog-0
          port: 9084
          targetPort: "9084"
        - name: hms-catalog-1
          port: 9085
          targetPort: "9085"
        - name: hms-catalog-2
          port: 9086
          targetPort: "9086"
        - name: hms-catalog-3
          port: 9087
          targetPort: "9087"
        - name: hms-catalog-4
          port: 9088
          targetPort: "9088"
        - name: hms-catalog-5
          port: 9089
          targetPort: "9089"
        - name: hms-catalog-6
          port: 9090
          targetPort: "9090"
        - name: hms-catalog-7
          port: 9091
          targetPort: "9091"
        - name: hms-catalog-8
          port: 9092
          targetPort: "9092"
        - name: hms-catalog-9
          port: 9093
          targetPort: "9093"
    - kind: ServiceAccount
      name: jaiscloud-gcp
      namespace: jaiscloud-gcp
      automountServiceAccountToken: true
images:
  - workload: jaiscloud
    image: jaisraj/jaiscloud-aws:latest
    pullPolicy: IfNotPresent
  - workload: jaiscloud-gcp
    image: jaisraj/jaiscloud-gcp:latest
    pullPolicy: IfNotPresent
  - workload: postgres
    image: postgres:16-alpine
env:
  - workload: jaiscloud
    values:
      JAISCLOUD_ACCOUNT_ID: "000000000000"
      JAISCLOUD_BLOB_DIR: /data/blobs
      JAISCLOUD_DSN: <secret:jaiscloud-dsn/dsn>
      JAISCLOUD_EXECUTOR_MODE: k8s
      JAISCLOUD_INSTANCE_ID: aws-substrate-1
      JAISCLOUD_K8S_APISERVER: https://kubernetes.default.svc
      JAISCLOUD_K8S_CA_FILE: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      JAISCLOUD_K8S_NAMESPACE: jaiscloud
      JAISCLOUD_K8S_SA: jaiscloud
      JAISCLOUD_K8S_SPARK_IMAGE: apache/spark:3.5.0
      JAISCLOUD_K8S_TOKEN_FILE: /var/run/secrets/kubernetes.io/serviceaccount/token
      JAISCLOUD_LAMBDA_IMAGE: public.ecr.aws/lambda/python:3.12
      JAISCLOUD_LOG_LEVEL: info
      JAISCLOUD_METRICS: "true"
      JAISCLOUD_MODE: full
      JAISCLOUD_PORT: "4566"
      JAISCLOUD_REGION: us-east-1
      JAISCLOUD_STATE_DIR: /data/state
  - workload: jaiscloud-gcp
    values:
      JAISCLOUD_CLOUDRUN_EXECUTOR_MODE: k8s
      JAISCLOUD_DATAPROC_HMS_ENDPOINT: jaiscloud-gcp.jaiscloud-gcp.svc.cluster.local:9083
      JAISCLOUD_DSN: <secret:jaiscloud-gcp-dsn/dsn>
      JAISCLOUD_GCS_EMULATOR_ENDPOINT: http://jaiscloud-gcp.jaiscloud-gcp.svc.cluster.local:8080
      JAISCLOUD_INSTANCE_ID: gcp-substrate-1
      JAISCLOUD_K8S_NAMESPACE: jaiscloud-gcp
      JAISCLOUD_K8S_SA: jaiscloud-gcp
      JAISCLOUD_K8S_SA_NAMESPACE: jaiscloud-gcp
      JAISCLOUD_K8S_SPARK_IMAGE: 10.0.100.21:5050/spark-gcs:3.5.0
      JAISCLOUD_K8S_SPARK_SUBMIT_PATH: /opt/spark/bin/spark-submit
      JAISCLOUD_KAFKA_BROKER_MODE: k8s
      JAISCLOUD_PLATFORM_TLS_ENABLED: "false"
      JAISCLOUD_SPARK_EXECUTOR_MODE: k8s
      JAISCLOUD_STATE_DIR: /data/state
playbook:
  audience: An LLM agent or script integrating JaisCloud into an existing Kubernetes cluster.
  destructive:
    - command: deploy/deploy.sh --reset
      deletes:
        - database jaiscloud
        - namespace jaiscloud (blobs + state PVCs)
      guards:
        - --yes or ASSUME_YES=1
    - command: deploy/deploy.sh --gcp-reset
      deletes:
        - database jaiscloud_gcp
        - pvc jaiscloud-gcp-blobs-pvc
      keeps:
        - jaiscloud-gcp-state-pvc
        - jaiscloud-data
    - command: deploy/deploy.sh --migrate-store
      deletes:
        - legacy postgres/jaiscloud-gcp Deployments and Services in jaiscloud
      guards:
        - refuses when jaiscloud-data/postgres-pvc exists
      keeps:
        - legacy PVCs as rollback copies
    - command: make test-dual-substrate-k8s
      deletes:
        - database jaiscloud (through --reset)
      guards:
        - ALLOW_RESET=1
  do_not:
    - action: Rewrite :authority / the Host header anywhere in the mesh
      why: GKE vs Managed Kafka share /v1/.../clusters; Cloud Run, Cloud Functions and S3 virtual-hosted requests carry identity in the host
    - action: Delete namespace jaiscloud-data or its PVC
      why: it is the shared store; both substrates die with it
    - action: Run deploy.sh --reset on a cluster whose AWS state matters
      why: it drops the AWS database and deletes the jaiscloud namespace (blobs + state PVCs)
    - action: Apply deploy/k8s/istio/*.yaml
      why: the glob includes dns.yaml, which intentionally contains no Kubernetes objects
    - action: Expose port 443 on the GCP Service by default
      why: TLS terminates at the front door; the pod's own HTTPS listener is REST-only and cluster-internal
    - action: Remove, weaken or bypass the jaiscloud-namespace-isolation policy
      why: both substrate ServiceAccounts hold cluster-wide namespace delete; the ValidatingAdmissionPolicy is the only boundary between their per-cluster namespaces
    - action: Edit a manifest in a running cluster by hand
      why: deploy.sh/up-k8s apply the repository manifests; changes drift and check-deploy-images/contract checks will not see them
  failure_taxonomy:
    - cause: image is private, not pushed, or not loaded into a kind/k3d node
      fix: publish the image, or k3d image import / kind load; set JAISCLOUD_GCP_IMAGE and redeploy
      symptom: ImagePullBackOff / ErrImagePull
    - cause: the substrate's database is missing
      fix: make postgres-gcp-db (or deploy.sh --gcp, which creates it before starting the pod)
      symptom: 'CrashLoopBackOff with ''postgres: ... does not exist'''
    - cause: older image against a store migrated by a newer build
      fix: run the same release that migrated the store, or restore the store from a backup
      symptom: CrashLoopBackOff with 'applied migration count N is ahead of this binary M'
    - cause: an emulator build predates the substrate/instance labels, or the request is for a namespace labelled with the other substrate
      fix: run an image that stamps jaiscloud.io/substrate + jaiscloud.io/instance-id; a pre-upgrade namespace is backfilled when next ensured. Do not remove the policy.
      symptom: namespace create/delete denied by 'jaiscloud-namespace-isolation'
    - cause: per-cluster RBAC not applied or the resolved ServiceAccount is wrong
      fix: kubectl apply -f deploy/k8s/rbac.yaml; verify JAISCLOUD_K8S_SA / _NAMESPACE (the emulator resolves them from env or the projected token)
      symptom: driver/broker Pods Forbidden
    - cause: kind/k3d have no LoadBalancer controller
      fix: use the port-forward deploy.sh prints; the front door is the external HTTP surface
      symptom: LoadBalancer EXTERNAL-IP pending
    - cause: host not in the four wildcard groups, or SNI and Host disagree
      fix: check the Gateway hosts and the certificate SANs (gen.sh prints them); never rewrite :authority
      symptom: mesh 421 Misdirected Request / TLS handshake failure
    - cause: 8081 not detected as gRPC (port name/appProtocol)
      fix: 'keep the Service port named grpc (or set appProtocol: http2)'
      symptom: gRPC hangs or 415 through the gateway
    - cause: the instance already holds state
      fix: add reset_first=true, or POST /_jaiscloud/reset first
      symptom: /_jaiscloud/import refuses with 'existing state found'
  ground_truth:
    - deploy/k8s/*.yaml — the manifests are authoritative for objects, ports, env and images.
    - docs/gcp/integration/contract.yaml — generated facts (topology, objects, images, env) + this playbook.
    - docs/gcp/integration/topology.md — the invariants the layout must keep.
    - scripts/integration-preflight.sh (deploy/deploy.sh --check) — read-only cluster inspection.
    - If the contract and a manifest disagree, the manifest wins; regenerate the contract.
  lifecycle:
    install_record:
      fields:
        desired: comma list of cloud=state, e.g. aws=running,gcp=parked
        installed: comma list of clouds that were installed, e.g. aws,gcp
        schema: "1"
      object: ConfigMap jaiscloud-data/jaiscloud-install
      owned_by: deploy/deploy.sh — no static manifest declares it, so an apply cannot erase the recorded intent
      skipped_when: jaiscloud-data does not exist (a warning, not a reason to create the store)
      survives: a substrate reset (--reset / --gcp-reset deletes only its own namespace); it lives with the store
      written_by:
        - '(default) aws install: installed += aws, desired aws=running'
        - '--gcp: installed += gcp, desired gcp=running'
        - '--delete: installed kept, desired aws=absent'
        - '--reset: desired aws=running (after the reinstall)'
        - '--gcp-reset: desired gcp=running'
        - '--migrate-store: installed aws,gcp, desired both running'
    intent:
      check:
        expect: intent.source=flag, intent.installed=[aws], intent.desired.aws=running, substrates[*].state/replicas/imageID
        run: deploy/deploy.sh --check --json --substrate aws
      leaks: 'a cloud outside installed with a namespace, Deployment or database is a warning: ''unexpected <cloud> footprint (intent=...)'''
      no_intent: when nothing is installed and no flag is given, the preflight says so and asks for --substrate instead of recommending a cloud
      precedence:
        - --substrate / --desired flags
        - ConfigMap jaiscloud-install in jaiscloud-data
        - inference from the substrate namespaces/Deployments
      recommendations: 'relative to intent: only an installed cloud is recommended, and an absent intended cloud is non-optional; a cloud outside installed is never a deploy target'
      source_values:
        - flag
        - cluster
        - inferred
      strict: exit 1 when a non-optional recommendation or a leak warning exists; optional work (the mesh) does not fail --strict
    states:
      absent: no Deployment in the substrate namespace (data may still exist)
      degraded: 'probe-only: present and scaled up, but nothing is available'
      parked: Deployment scaled to spec.replicas=0; namespaces, PVCs, databases and state survive
      running: Deployment present, spec.replicas > 0, availableReplicas >= 1
  platform:
    kubernetes:
      check: 'deploy/deploy.sh --check --json   # rbac.serverVersion + rbac.admissionPolicy'
      enforced_by: deploy/deploy.sh require_isolation_prereqs() — refuses install/reset/migrate on < 1.30 or when the VAP API is missing
      minimum_version: "1.30"
      reason: ValidatingAdmissionPolicy (admissionregistration.k8s.io/v1) is GA in 1.30; RBAC cannot scope a namespace delete by label.
    rbac:
      admission_policy:
        apply: 'kubectl apply -f deploy/k8s/rbac-admission-policy.yaml   # idempotent; deploy.sh applies it on every install path'
        gate: 'GATE_ALLOW_RBAC=1 KUBE_CONTEXT=<ctx> make test-rbac-isolation-k8s   # server-side dry runs: allow own, deny the other''s, both directions'
        limitation: Admission cannot read the target Namespace's labels, so the RoleBinding rule is a write-shape guard, not the namespace boundary.
        mode: 'failurePolicy: Fail, validationActions: [Deny], matched only to the two substrate ServiceAccounts'
        namespace_rules:
          create: must carry jaiscloud.io/managed-by=jaiscloud and jaiscloud.io/substrate=<caller's substrate>
          delete: oldObject must carry jaiscloud.io/managed-by=jaiscloud and the caller's jaiscloud.io/substrate
          update: the old AND new object must carry the caller's labels — another substrate's namespace cannot be relabelled or claimed
        object: ValidatingAdmissionPolicy + ValidatingAdmissionPolicyBinding jaiscloud-namespace-isolation (deploy/k8s/rbac-admission-policy.yaml)
        operator_paths: The policy matches only the two ServiceAccounts; kubectl applied by the operator (including --reset deleting the jaiscloud namespace) is unaffected.
        rolebinding_rule: create/update must carry jaiscloud.io/managed-by=jaiscloud and the caller's substrate label
        verify: 'deploy/deploy.sh --check --json   # rbac.admissionPolicy=true'
      namespace_admin:
        grants: namespaces get/list/watch/create/update/patch/delete (update/patch for identity-label backfill; the admission policy keeps it to owned namespaces) + rolebindings get/list/create/update/delete, cluster-wide
        object: ClusterRole/ClusterRoleBinding jaiscloud-namespace-admin
        subjects:
          - system:serviceaccount:jaiscloud:jaiscloud (aws)
          - system:serviceaccount:jaiscloud-gcp:jaiscloud-gcp (gcp)
        why: Dataproc creates one namespace per cluster and Managed Kafka one per broker; both substrates need it.
  prerequisites:
    - check: kubectl version --client
      id: kubectl
      note: The current kubectl context is used unless KUBE_CONTEXT is set. Never assume docker-desktop.
    - check: kubectl cluster-info
      id: cluster
    - check: command -v docker
      id: docker
      note: Only needed when building images (default deploy.sh path).
    - check: kubectl config current-context
      id: cluster-kind
      note: kind/k3d nodes cannot see the host's image store; deploy.sh loads built images for those contexts.
    - check: 'kubectl version -o json   # parse serverVersion.minor (>= 30)'
      id: kubernetes-version
      note: Dual-substrate namespace isolation is a ValidatingAdmissionPolicy (GA in 1.30); deploy.sh refuses an older server before creating anything.
  scenarios:
    custom-images:
      steps:
        - id: build
          run: docker build --build-arg CLOUD=gcp -t <registry>/jaiscloud-gcp:<tag> .
        - id: deliver
          run: 'docker push <registry>/jaiscloud-gcp:<tag>   # or: k3d image import -c <cluster> <image>; kind load docker-image <image>'
        - id: deploy
          note: deploy.sh sets the image and imagePullPolicy=IfNotPresent on the Deployment.
          run: JAISCLOUD_GCP_IMAGE=<image> deploy/deploy.sh --gcp --yes
        - id: spark
          note: Dataproc jobs cannot run without it; plain apache/spark cannot read gs://.
          run: kubectl -n jaiscloud-gcp set env deploy/jaiscloud-gcp JAISCLOUD_K8S_SPARK_IMAGE=<spark image with the GCS connector>
      summary: Run your own emulator build instead of the published image.
    executors:
      steps:
        - id: rbac
          note: Per-cluster namespaces, driver Pods and brokers need it; without it the emulator falls back to mock.
          run: kubectl apply -f deploy/k8s/rbac.yaml
        - id: spark-image
          run: Set JAISCLOUD_K8S_SPARK_IMAGE to a reachable image with the GCS connector (see custom-images).
        - expect: substrates.gcp.ready=true and no executors warnings
          id: verify
          run: deploy/deploy.sh --check --json
      summary: Enable Dataproc / Managed Kafka / Cloud Run on Kubernetes.
    inspect:
      steps:
        - expect: exit 0; JSON with context, intent, namespaces, legacy, store, substrates, mesh, recommended[]
          id: preflight
          note: No mutation. Act on recommended[]; do not guess from the presence of a pod. Pass --substrate aws|gcp|both (and --desired) to assert an intended shape.
          run: deploy/deploy.sh --check --json
        - expect: Same facts, human-readable.
          id: human-preflight
          run: deploy/deploy.sh --check
      summary: 'Read-only: what is already installed, and what is the next safe step?'
    mesh:
      preconditions:
        - both substrate Services exist (or at least the ones whose hosts you route)
        - istioctl on PATH
      steps:
        - id: install-istio
          note: profile=minimal installs istiod only; the component flag adds the gateway.
          run: istioctl install -y --set profile=minimal --set 'components.ingressGateways[0].enabled=true' --set 'components.ingressGateways[0].name=istio-ingressgateway'
        - id: certs
          note: Writes the dev CA in $HOME/.cache/jaiscloud/istio-ca, the TLS secret and the CA ConfigMaps. --force rotates the CA (clients must re-trust).
          run: deploy/k8s/istio/certs/gen.sh
        - id: routes
          note: 'Do not apply deploy/k8s/istio/*.yaml: dns.yaml contains no objects.'
          run: kubectl apply -f deploy/k8s/istio/gateway.yaml -f deploy/k8s/istio/virtualservices.yaml -f deploy/k8s/istio/destinationrule.yaml
        - expect: exit 0; 4 assertions (GKE not Managed Kafka, GCS, gRPC h2c, STS)
          id: verify
          run: SMOKE_PORT_FORWARD=1 scripts/istio-smoke.sh
        - accept: IST0101 for jaiscloud.jaiscloud.svc is expected on a GCP-only install
          id: analyze
          run: istioctl analyze -n istio-system
      summary: Add the Istio front door in front of already-installed substrates.
    new-install-both:
      steps:
        - expect: deployment/jaiscloud rolled out in jaiscloud
          id: aws
          run: deploy/deploy.sh --yes
        - expect: deployment/jaiscloud-gcp rolled out in jaiscloud-gcp
          id: gcp
          run: deploy/deploy.sh --gcp --yes
        - expect: substrates.aws.ready=true, substrates.gcp.ready=true, recommended=[]
          id: verify
          run: deploy/deploy.sh --check --json
      summary: AWS + GCP substrates plus the shared store (one cluster, no mesh).
    new-install-gcp:
      preconditions:
        - jaiscloud-data does not exist yet, or its postgres deployment is healthy
        - no IaC owns the same object names
      steps:
        - id: plan
          note: Prints the commands without executing them.
          run: deploy/deploy.sh --gcp --plan
        - expect: exit 0; deployment/jaiscloud-gcp rolled out in jaiscloud-gcp
          id: apply
          note: Omit JAISCLOUD_GCP_IMAGE to use the published image; see custom-images.
          run: JAISCLOUD_GCP_IMAGE=<image> deploy/deploy.sh --gcp --yes
        - expect: store.ready=true, store.databases.jaiscloud_gcp=true, substrates.gcp.ready=true, recommended=[]
          id: verify
          run: deploy/deploy.sh --check --json
      summary: GCP substrate only (no AWS substrate, no mesh).
    upgrade-legacy:
      detect:
        - check: kubectl -n jaiscloud get deployment postgres
          means: legacy store still in the AWS namespace
        - check: kubectl -n jaiscloud-data get pvc postgres-pvc
          means: new store already exists; --migrate-store refuses (drop the new PVC only if it is disposable)
        - check: kubectl -n jaiscloud get deployment jaiscloud-gcp
          means: legacy GCP substrate; its object bytes must be copied
      steps:
        - id: preflight
          note: legacy.* predicates and recommended[] tell you whether this scenario applies.
          run: deploy/deploy.sh --check --json
        - destructive: false
          id: stop
          run: 'Ask the operator before running --migrate-store: it stops both emulators and rewrites the store.'
        - deletes:
            - the legacy postgres and jaiscloud-gcp Deployments/Services in jaiscloud (PVCs are kept)
          destructive: true
          expect: exit 0; both databases restored, GCP bytes copied, both substrates rolled out
          id: migrate
          keeps:
            - jaiscloud/postgres-pvc and jaiscloud/jaiscloud-gcp-blobs-pvc as rollback copies
          note: Needs a pullable busybox for the byte copy; preload it or set SKIP_BLOB_MIGRATE=1 and copy the PVC yourself.
          run: SKIP_IMAGE_BUILD=1 deploy/deploy.sh --migrate-store --yes
        - id: verify-store
          note: Substitute a table/row you know should have survived.
          run: kubectl -n jaiscloud-data exec deploy/postgres -- psql -U jaiscloud -d jaiscloud -tAc "select count(*) from aws.migration_probe"
        - id: verify-gcp-bytes
          run: Read an existing GCS object through the new substrate (port-forward 8080 and GET /storage/v1/b/<bucket>/o/<object>?alt=media).
        - expect: legacy.postgresInAws=false, legacy.gcpInAws=false, both substrates ready
          id: verify
          run: deploy/deploy.sh --check --json
        - id: cleanup
          note: Only after verifying both substrates. A later --reset deletes them with the namespace anyway.
          run: kubectl -n jaiscloud delete pvc postgres-pvc jaiscloud-gcp-blobs-pvc
      summary: Pre-split single-namespace install (postgres and the GCP emulator both in jaiscloud) -> three namespaces.
  tooling:
    agent_guide:
      command: jaiscloud-<cloud> agent-guide [--json|--emit DIR] [--force]
      note: 'The binary embeds this pack; --emit writes the deployment kit (manifests, deploy.sh, preflight, Istio/CI assets, docs) for users who only have an image or a release binary. In-cluster: kubectl -n <ns> exec deploy/<workload> -- /jaiscloud agent-guide.'
    deploy_sh:
      entry: deploy/deploy.sh
      exit_codes:
        0: success
        1: failure
        2: usage/refused
      modes:
        - (default) aws install
        - --gcp
        - --migrate-store
        - --delete
        - --reset
        - --gcp-reset
        - --check [--substrate aws|gcp|both] [--desired aws=running,gcp=parked]
        - --plan
        - --skip-build
        - --yes
    emulator_api:
      base: REST port (8080 GCP / 4566 AWS)
      endpoints:
        - GET /_jaiscloud/health -> {"status":"ok"}
        - GET /_jaiscloud/doctor (+ ?verbose=true) -> JSON diagnostics
        - POST /_jaiscloud/reset[?account=&region=] -> wipe state
        - GET /_jaiscloud/export -> gzip tarball of all state
        - POST /_jaiscloud/import[?reset_first=true&dry_run=true] -> restore
        - POST /_jaiscloud/clock {"mode":"fixed|offset","time":...} -> deterministic time
    make:
      entry: make help
      targets:
        - up-k8s
        - up-k8s-gcp
        - postgres-gcp-db
        - down-k8s
        - check-deploy-images
        - test-istio-smoke
        - test-dual-substrate-k8s
        - test-rbac-isolation-k8s
        - gcp-ci-preflight
  verification:
    - expect: jaiscloud (substrate/aws), jaiscloud-gcp (substrate/gcp), jaiscloud-data (data)
      id: namespaces
      run: kubectl get ns -l jaiscloud.io/role
    - expect: '{"status":"ok"}'
      id: health-aws
      run: kubectl -n jaiscloud port-forward svc/jaiscloud 4566:4566 & curl -sf http://127.0.0.1:4566/_jaiscloud/health
    - expect: '{"status":"ok"}'
      id: health-gcp
      run: kubectl -n jaiscloud-gcp port-forward svc/jaiscloud-gcp 8080:8080 & curl -sf http://127.0.0.1:8080/_jaiscloud/health
    - expect: jaiscloud (AWS) and, with the GCP substrate, jaiscloud_gcp
      id: databases
      run: kubectl -n jaiscloud-data exec deploy/postgres -- psql -U jaiscloud -d postgres -tAc "select datname from pg_database where datname like 'jaiscloud%'"
    - expect: 4/4 passed
      id: mesh-smoke
      run: SMOKE_PORT_FORWARD=1 scripts/istio-smoke.sh
    - destructive: true
      expect: 13/13 passed; destructive (drops the AWS database)
      id: isolation-gate
      run: KUBE_CONTEXT=<ctx> ALLOW_RESET=1 make test-dual-substrate-k8s
    - expect: '11/11 passed: each substrate ServiceAccount may delete only its own labelled namespace, cannot relabel the other''s, may backfill a pre-upgrade namespace, and an unlabelled RoleBinding is denied (server-side dry runs, no install change)'
      id: rbac-isolation
      run: GATE_ALLOW_RBAC=1 KUBE_CONTEXT=<ctx> make test-rbac-isolation-k8s
  version: 1
