# GCP per-package statement-coverage floor (TD11) — a ratchet, not a target.
#
# Regenerate from a fresh profile with `make test-gcp-coverage-update`; the
# update RAISES a recorded floor but refuses to LOWER one unless ALLOW_LOWER=1
# is set, so a coverage drop cannot be laundered by re-running it. The gate
# (`make test-gcp-coverage`) fails when a measured package drops more than
# 0.5pp below its floor (a small noise tolerance for timing-dependent tests),
# when a measured package has no entry here, or when an entry names a package
# that no longer produces coverage data. Generated protobuf packages (a final
# path element ending in `pb`) are excluded mechanically, as are packages with
# no test files (they produce no coverage data).
#
# package: repo-relative package directory (`internal/gcp/...`).
# min_percent: statement-coverage floor, two decimals.
